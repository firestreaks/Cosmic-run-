<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COSMIC LEGENDS: SELECT YOUR MORTAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; color: white; }
        canvas { display: block; }
        #hud { position: absolute; top: 15px; left: 15px; pointer-events: none; z-index: 10; }
        .stat { margin-bottom: 5px; text-shadow: 0 0 10px #000; font-size: 18px; color: #00ffcc; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #char-select { display: flex; gap: 20px; margin-top: 30px; }
        .card { width: 150px; padding: 20px; border: 2px solid #444; text-align: center; cursor: pointer; transition: 0.3s; background: #111; }
        .card:hover { border-color: #00ffcc; transform: translateY(-10px); background: #222; }
        .card.selected { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        .card h3 { margin: 10px 0 5px; font-size: 14px; }
        .card p { font-size: 10px; color: #aaa; }

        #dice-zone { display: none; margin-top: 20px; font-size: 40px; color: #ff0044; }
        .btn { margin-top: 30px; padding: 15px 40px; border: 2px solid #fff; background: none; color: white; font-family: 'Orbitron'; cursor: pointer; font-size: 18px; visibility: hidden; }
        .btn.ready { visibility: visible; }
    </style>
</head>
<body>

<div id="hud">
    <div class="stat" id="active-char">SELECT CHARACTER</div>
    <div class="stat">TILE: <span id="tile-num">0</span> / 100</div>
    <div class="stat" id="nrg-ui">ENERGY: 100%</div>
</div>

<div id="overlay">
    <h1 id="m-title">COSMIC LEGENDS</h1>
    <p id="m-desc">Choose your starting Mortal to begin the swirl path.</p>
    
    <div id="char-select">
        <div class="card" onclick="pick('den', '#44aaff')">
            <div style="font-size:40px">⚡</div>
            <h3>DEN</h3>
            <p>LIGHTNING<br>High Jump</p>
        </div>
        <div class="card" onclick="pick('lapse', '#bb44ff')">
            <div style="font-size:40px">🌌</div>
            <h3>LAPSE</h3>
            <p>GALAXY<br>Energy Efficient</p>
        </div>
        <div class="card" onclick="pick('ron', '#ffaa00')">
            <div style="font-size:40px">☀️</div>
            <h3>RON</h3>
            <p>SUN<br>Shielded Start</p>
        </div>
    </div>

    <div id="dice-zone">🎲 <span id="roll-val">?</span></div>
    <button id="start-btn" class="btn" onclick="startGame()">START MISSION</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameActive = false, energy = 100, tile = 0, cameraX = 0;
let selectedChar = null;
let bossTiles = [30, 42, 58, 75];

const player = { x: 50, y: 300, w: 40, h: 60, vx: 0, vy: 0, grounded: false, color: '#fff', jumpPower: -16 };
let platforms = [{x: 0, y: canvas.height - 150, w: 1000, h: 40}];

function pick(name, color) {
    selectedChar = name;
    player.color = color;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    document.getElementById('start-btn').classList.add('ready');
    
    // Character Stats
    if(name === 'den') player.jumpPower = -20;
    else player.jumpPower = -16;
}

function startGame() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('active-char').innerText = "PLAYER: " + selectedChar.toUpperCase();
    gameActive = true;
}

function update() {
    if (!gameActive) return;

    if (keys['ArrowRight']) player.vx = 8;
    else if (keys['ArrowLeft']) player.vx = -8;
    else player.vx *= 0.8;

    if (keys['ArrowUp'] && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    player.vy += 0.9; player.x += player.vx; player.y += player.vy;
    cameraX += (player.x - cameraX - 250) * 0.1;

    tile = Math.floor(player.x / 200);
    document.getElementById('tile-num').innerText = tile;
    document.getElementById('nrg-ui').innerText = "ENERGY: " + Math.floor(energy) + "%";

    // Infinite Gen
    if (platforms[platforms.length - 1].x < cameraX + canvas.width) {
        let last = platforms[platforms.length - 1];
        platforms.push({x: last.x + last.w + 100, y: canvas.height - 150 - (Math.random() * 100), w: 400, h: 40});
    }

    // Basic Collision
    player.grounded = false;
    platforms.forEach(p => {
        if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h > p.y && player.y + player.h < p.y + player.vy + 10) {
            player.y = p.y - player.h; player.vy = 0; player.grounded = true;
        }
    });

    if (player.y > canvas.height) location.reload();
}

function draw() {
    ctx.fillStyle = '#050005';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.save(); ctx.translate(-cameraX, 0);

    platforms.forEach(p => {
        ctx.fillStyle = '#111'; ctx.strokeStyle = player.color;
        ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    ctx.shadowBlur = 15; ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    
    if(selectedChar === 'ron') {
        ctx.fillStyle = "#e3c28d"; ctx.fillRect(player.x - 5, player.y - 5, 50, 8); // Straw hat
    }

    ctx.restore();
}

const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => keys[e.code] = false;

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>

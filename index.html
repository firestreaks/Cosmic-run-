<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC LEGENDS: WARP RUNNER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Press Start 2P', cursive; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #fff; z-index: 10; font-size: 12px; pointer-events: none; }
        #menu { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lane-btn { padding: 20px; margin: 10px; background: #111; border: 4px solid #444; color: #fff; cursor: pointer; }
        .lane-btn.active { border-color: #0ff; box-shadow: 0 0 15px #0ff; }
    </style>
</head>
<body>

<div id="ui">DISTANCE: <span id="dist">0</span>m</div>

<div id="menu">
    <h1 style="color: #0ff; font-size: 18px; margin-bottom: 20px;">COSMIC RUNNER</h1>
    <div style="display: flex;">
        <div class="lane-btn" onclick="sel('ron','#f50','☀️')">RON</div>
        <div class="lane-btn" onclick="sel('den','#0ff','⚡')">DEN</div>
        <div class="lane-btn" onclick="sel('lapse','#b0f','🌌')">LAPSE</div>
    </div>
    <button id="start" style="margin-top: 30px; font-family: 'Press Start 2P'; padding: 10px; display: none;" onclick="start()">WARP START</button>
</div>

<canvas id="g"></canvas>

<script>
const cvs = document.getElementById('g');
const ctx = cvs.getContext('2d');
const vW = 400, vH = 240;
cvs.width = vW; cvs.height = vH;
cvs.style.width = '100vw'; cvs.style.height = '100vh';

let run = false, score = 0, hero = {}, obstacles = [], lanes = [-80, 0, 80];
let playerLane = 1; // 0: Left, 1: Middle, 2: Right
let targetX = 0;
let currentX = 0;

function sel(id, col, icon) {
    hero = { id, col, icon };
    document.querySelectorAll('.lane-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('start').style.display = 'block';
}

function start() { document.getElementById('menu').style.display = 'none'; run = true; }

// Input: Click left half to move left, right half to move right
window.addEventListener('mousedown', (e) => {
    if(!run) return;
    if(e.clientX < window.innerWidth / 2) {
        if(playerLane > 0) playerLane--;
    } else {
        if(playerLane < 2) playerLane++;
    }
});

function update() {
    if(!run) return;
    score++;
    document.getElementById('dist').innerText = Math.floor(score/10);

    // Smooth lane transition
    targetX = lanes[playerLane];
    currentX += (targetX - currentX) * 0.2;

    // Spawn obstacles
    if(score % 40 === 0) {
        obstacles.push({
            lane: Math.floor(Math.random()*3),
            z: 500, // Distance away
            w: 40, h: 40
        });
    }

    obstacles.forEach((o, i) => {
        o.z -= 8; // Move toward player
        if(o.z < -50) obstacles.splice(i, 1);

        // Simple collision
        if(o.z < 20 && o.z > -20 && o.lane === playerLane) {
            location.reload(); // Game Over
        }
    });
}

function draw() {
    ctx.fillStyle = '#050005';
    ctx.fillRect(0, 0, vW, vH);

    // Draw 3D Lanes (Pseudo-perspective)
    ctx.strokeStyle = '#222';
    ctx.beginPath();
    lanes.forEach(l => {
        ctx.moveTo(vW/2 + l/4, 100);
        ctx.lineTo(vW/2 + l*2, vH);
    });
    ctx.stroke();

    // Draw Obstacles
    obstacles.forEach(o => {
        let scale = 200 / (o.z + 1); // Perspective scale
        let ox = vW/2 + (lanes[o.lane] * (400 - o.z) / 400);
        let oy = 100 + (120 * (400 - o.z) / 400);
        
        ctx.fillStyle = '#f00';
        ctx.fillRect(ox - (o.w*scale)/2, oy - (o.h*scale)/2, o.w*scale, o.h*scale);
    });

    // Draw Player
    ctx.save();
    let px = vW/2 + currentX;
    let py = vH - 40;
    ctx.fillStyle = hero.col;
    ctx.shadowBlur = 15; ctx.shadowColor = hero.col;
    ctx.fillRect(px - 15, py - 15, 30, 30);
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.fillText(hero.icon, px - 8, py + 5);
    ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REYSHI CHASE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;height:100vh;width:100vw;font-family:'Nunito',sans-serif;background:#111;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s,transform .4s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97);}

/* ── INTRO ── */
#intro{background:radial-gradient(ellipse at 50% 40%,#1a0030,#05000f);}
.s-bg{position:absolute;inset:0;}
.logo{font-family:‘Fredoka One’,cursive;font-size:clamp(64px,12vw,120px);letter-spacing:4px;line-height:.92;text-align:center;z-index:2;
-webkit-text-stroke:3px rgba(255,255,255,.15);}
.lr{color:#ff3366;text-shadow:0 4px 0 #aa0022,0 0 40px #ff3366;animation:glow 2s infinite alternate;}
.lc{color:#ffffff;text-shadow:0 4px 0 #666;}
@keyframes glow{from{text-shadow:0 4px 0 #aa0022,0 0 30px #ff3366}to{text-shadow:0 4px 0 #aa0022,0 0 70px #ff3366,0 0 120px #ff000044}}
.tag{color:#888;font-size:15px;letter-spacing:2px;margin:14px 0 52px;z-index:2;font-weight:700;}
.btn{font-family:‘Fredoka One’,cursive;border:none;cursor:pointer;border-radius:50px;transition:transform .12s,box-shadow .12s;letter-spacing:1px;}
.btn:hover{transform:scale(1.06) translateY(-2px);}
.btn:active{transform:scale(.94) translateY(1px);}
.bplay{font-size:28px;padding:16px 72px;background:linear-gradient(160deg,#ff4477,#ff6600);color:#fff;
box-shadow:0 6px 0 #aa2244, 0 0 40px #ff336655;z-index:2;}
.intro-r{position:absolute;bottom:0;right:6%;opacity:.2;filter:drop-shadow(0 0 40px #ff3366);animation:lurk 3s ease-in-out infinite;}
@keyframes lurk{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

/* ── HERO SELECT ── */
#hs{background:linear-gradient(150deg,#0a001a,#120028,#050010);}
.ht{font-family:‘Fredoka One’,cursive;font-size:clamp(30px,5vw,52px);color:#fff;margin-bottom:6px;
text-shadow:0 3px 0 #330066;}
.hsub{color:#8866aa;font-size:13px;margin-bottom:32px;font-weight:700;}
.hgrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.hcard{width:152px;border-radius:20px;padding:18px 12px 14px;cursor:pointer;border:3px solid transparent;
background:rgba(255,255,255,.05);transition:transform .3s,border-color .3s,box-shadow .3s;text-align:center;position:relative;overflow:hidden;}
.hcard:hover{transform:translateY(-10px);}
.hcard.sel{transform:translateY(-14px) scale(1.05);}
.hglow{position:absolute;inset:0;opacity:0;transition:opacity .3s;border-radius:20px;}
.hcard:hover .hglow,.hcard.sel .hglow{opacity:1;}
.hcard canvas{display:block;margin:0 auto 10px;}
.hn{font-family:‘Fredoka One’,cursive;font-size:22px;color:#fff;margin-bottom:2px;text-shadow:0 2px 0 #000;}
.he{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.hd{font-size:11px;color:#667;line-height:1.4;font-weight:700;}
.sbadge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;background:#ffd700;color:#000;opacity:0;transition:opacity .3s;}
.hcard.sel .sbadge{opacity:1;}
.bstart{font-size:22px;padding:14px 56px;margin-top:28px;background:linear-gradient(160deg,#6600ff,#aa00ff);color:#fff;
box-shadow:0 5px 0 #330088, 0 0 28px #6600ff44;}
.bstart:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;}

/* ── GAME ── */
#game{background:#111;}
#gc{display:block;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;}
.hbox{background:rgba(0,0,0,.6);border-radius:16px;padding:6px 16px;border:2px solid rgba(255,255,255,.1);}
.hlabel{font-size:9px;font-weight:900;letter-spacing:3px;color:#aaa;text-transform:uppercase;}
.hscore{font-family:‘Fredoka One’,cursive;font-size:32px;color:#fff;line-height:1;text-shadow:0 2px 0 #000;}
.hearts{display:flex;gap:5px;align-items:center;background:rgba(0,0,0,.6);border-radius:16px;padding:8px 12px;border:2px solid rgba(255,255,255,.1);}
.heart{font-size:22px;transition:all .2s;filter:drop-shadow(0 0 4px #ff4466);}
.heart.dead{opacity:.2;filter:grayscale(1);}

/* COUNTDOWN */
#cdOv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;pointer-events:none;}
#cdN{font-family:‘Fredoka One’,cursive;font-size:180px;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.4),0 0 60px #fff;opacity:0;transform:scale(2);transition:all .25s;}
#cdN.show{opacity:1;transform:scale(1);}
#cdN.go{color:#00ffaa;text-shadow:0 8px 0 #006644,0 0 60px #00ffaa;}

/* controls hint */
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#bbb;font-size:11px;font-weight:700;letter-spacing:2px;pointer-events:none;text-transform:uppercase;padding:6px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.1);}

/* attack flash */
#atkFlash{position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;transition:opacity .08s;}

/* GAMEOVER */
#go{background:rgba(0,0,0,.92);backdrop-filter:blur(16px);z-index:20;}
.got{font-family:‘Fredoka One’,cursive;font-size:clamp(56px,10vw,96px);color:#ff3366;text-shadow:0 6px 0 #880022,0 0 40px #ff3366;animation:goS .12s infinite;}
@keyframes goS{0%,100%{transform:rotate(-.7deg) scale(1)}50%{transform:rotate(.7deg) scale(1.01)}}
.god{font-family:‘Fredoka One’,cursive;font-size:48px;color:#ffd700;text-shadow:0 4px 0 #886600;letter-spacing:2px;margin:10px 0 4px;}
.gob{font-size:15px;color:#558;font-weight:700;letter-spacing:2px;margin-bottom:38px;}
.gobr{display:flex;gap:14px;}
.br{font-size:22px;padding:13px 40px;background:linear-gradient(160deg,#ff3366,#ff6600);color:#fff;box-shadow:0 5px 0 #882233;}
.bm{font-size:22px;padding:13px 40px;background:rgba(255,255,255,.08);color:#ccc;border:2px solid #334;}
</style>

</head>
<body>

<!-- INTRO -->

<div id="intro" class="screen">
  <canvas class="s-bg" id="sCv"></canvas>
  <svg class="intro-r" width="160" height="240" viewBox="0 0 160 240">
    <ellipse cx="80" cy="46" rx="30" ry="34" fill="#ff1133"/>
    <rect x="50" y="76" width="60" height="84" rx="10" fill="#cc0022"/>
    <rect x="26" y="82" width="26" height="60" rx="10" fill="#cc0022"/>
    <rect x="108" y="82" width="26" height="60" rx="10" fill="#cc0022"/>
    <rect x="52" y="160" width="22" height="72" rx="10" fill="#aa0011"/>
    <rect x="86" y="160" width="22" height="72" rx="10" fill="#aa0011"/>
    <polygon points="66,16 72,0 78,16" fill="#770011"/><polygon points="92,16 98,0 104,16" fill="#770011"/>
    <circle cx="70" cy="42" r="7" fill="#ff6688"/><circle cx="90" cy="42" r="7" fill="#ff6688"/>
  </svg>
  <div class="logo"><div class="lr">REYSHI</div><div class="lc">CHASE</div></div>
  <div class="tag">Run · Dodge · Survive</div>
  <button class="btn bplay" onclick="gHS()">▶ PLAY NOW</button>
</div>

<!-- HERO SELECT -->

<div id="hs" class="screen hidden">
  <div class="ht">Pick Your Hero</div>
  <div class="hsub">Each hero has a unique world!</div>
  <div class="hgrid" id="hGrid"></div>
  <button class="btn bstart" id="bStart" disabled onclick="startCD()">Let's Run!</button>
</div>

<!-- GAME -->

<div id="game" class="screen hidden">
  <canvas id="gc"></canvas>
  <div id="hud">
    <div class="hbox"><div class="hlabel">Distance</div><div class="hscore" id="hScore">0m</div></div>
    <div class="hearts" id="hHearts"></div>
  </div>
  <div id="atkFlash"></div>
  <div id="cdOv"><div id="cdN">3</div></div>
  <div id="hint">← → Lane &nbsp;|&nbsp; ↑ Jump &nbsp;|&nbsp; ↓ Slide &nbsp;|&nbsp; F Attack</div>
</div>

<!-- GAMEOVER -->

<div id="go" class="screen hidden">
  <div class="got">CAUGHT!</div>
  <div class="god" id="goD">0 M</div>
  <div class="gob" id="goB">Best: 0 m</div>
  <div class="gobr">
    <button class="btn br" onclick="restart()">↺ Again</button>
    <button class="btn bm" onclick="gHS()">⌂ Menu</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// HEROES
// ═══════════════════════════════════════════════════
const HEROES=[
  {name:'RON',  elem:'Fire',   col:'#ff5500',col2:'#ffaa00',glow:'#ff6600',dark:'#aa2200',jMul:1.0, sMul:1.15,atkCol:'#ff6600',atkName:'Fireball'},
  {name:'LAPSE',elem:'Galaxy', col:'#8833ff',col2:'#cc88ff',glow:'#aa44ff',dark:'#440088',jMul:1.3, sMul:0.95,atkCol:'#aa44ff',atkName:'Stardust'},
  {name:'DEN',  elem:'Lightning',col:'#ccaa00',col2:'#ffff88',glow:'#ffee44',dark:'#886600',jMul:0.95,sMul:1.25,atkCol:'#ffff00',atkName:'Thunder'},
  {name:'BLACKDEATH',elem:'Void',col:'#5500aa',col2:'#cc00ff',glow:'#8800ff',dark:'#220044',jMul:1.15,sMul:1.05,atkCol:'#cc00ff',atkName:'Void Blast'},
];

// ── INTRO STARS ──
(function(){
  const cv=document.getElementById('sCv');
  const rsz=()=>{cv.width=innerWidth;cv.height=innerHeight;};rsz();addEventListener('resize',rsz);
  const c=cv.getContext('2d');
  const S=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3}));
  let t=0;(function tick(){c.clearRect(0,0,cv.width,cv.height);S.forEach(s=>{c.globalAlpha=.15+Math.sin(t*.025+s.x*8)*.15;c.fillStyle='#fff';c.beginPath();c.arc(s.x*cv.width,s.y*cv.height,s.r,0,Math.PI*2);c.fill();});c.globalAlpha=1;t++;requestAnimationFrame(tick);})();
})();

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}

let selHero=-1,bestScore=0,cAFs={};

function gHS(){selHero=-1;document.getElementById('bStart').disabled=true;showScreen('hs');buildCards();}

function buildCards(){
  Object.values(cAFs).forEach(cancelAnimationFrame);cAFs={};
  const g=document.getElementById('hGrid');g.innerHTML='';
  HEROES.forEach((h,i)=>{
    const d=document.createElement('div');d.className='hcard';
    d.innerHTML=`<div class="hglow" style="background:radial-gradient(ellipse at 50% 80%,${h.glow}33,transparent 70%)"></div>
      <span class="sbadge">✓ Chosen</span>
      <canvas width="126" height="112" id="hcv${i}"></canvas>
      <div class="hn" style="color:${h.col};text-shadow:0 2px 0 ${h.dark}">${h.name}</div>
      <div class="he" style="color:${h.glow};text-shadow:0 0 8px ${h.glow}88">${h.elem}</div>
      <div class="hd">${h.atkName}</div>`;
    d.onclick=()=>pickH(i);g.appendChild(d);
    animCard(i);
  });
}
function animCard(i){
  const cv=document.getElementById('hcv'+i);const c=cv.getContext('2d');
  let t=i*18;(function tick(){c.clearRect(0,0,126,112);drawHeroFront(c,63,106,t,HEROES[i],0.9);t++;cAFs[i]=requestAnimationFrame(tick);})();
}
function pickH(i){
  selHero=i;
  document.querySelectorAll('.hcard').forEach((c,j)=>{c.classList.toggle('sel',j===i);c.style.borderColor=j===i?HEROES[j].col:'transparent';c.style.boxShadow=j===i?`0 0 30px ${HEROES[j].glow}66`:'none';});
  document.getElementById('bStart').disabled=false;
}

// ─── DRAW HERO FRONT-FACING (for card preview) ───
function drawHeroFront(c,x,y,t,h,sc){
  c.save();c.translate(x,y);
  const bob=Math.abs(Math.sin(t*.2))*-3;
  const leg=Math.sin(t*.25)*14;
  const arm=Math.cos(t*.25)*13;
  // legs
  c.fillStyle=h.dark;
  c.save();c.translate(-10*sc,bob);c.rotate(leg*Math.PI/180);c.beginPath();c.roundRect(-5*sc,-28*sc,10*sc,28*sc,4);c.fill();
  c.fillStyle='#111';c.beginPath();c.roundRect(-7*sc,-2,14*sc,8*sc,3);c.fill();c.restore();
  c.save();c.translate(10*sc,bob);c.rotate(-leg*Math.PI/180);c.fillStyle=h.dark;c.beginPath();c.roundRect(-5*sc,-28*sc,10*sc,28*sc,4);c.fill();
  c.fillStyle='#111';c.beginPath();c.roundRect(-7*sc,-2,14*sc,8*sc,3);c.fill();c.restore();
  // body
  c.fillStyle=h.col;c.beginPath();c.roundRect(-14*sc,-68*sc+bob,28*sc,42*sc,6);c.fill();
  // arms
  c.strokeStyle=h.col;c.lineWidth=9*sc;c.lineCap='round';
  c.save();c.translate(-14*sc,-54*sc+bob);c.rotate(arm*Math.PI/180);c.beginPath();c.moveTo(0,0);c.lineTo(-10*sc,22*sc);c.stroke();c.restore();
  c.save();c.translate(14*sc,-54*sc+bob);c.rotate(-arm*Math.PI/180);c.beginPath();c.moveTo(0,0);c.lineTo(10*sc,22*sc);c.stroke();c.restore();
  // head
  c.fillStyle=h.col;c.beginPath();c.arc(0,-78*sc+bob,15*sc,0,Math.PI*2);c.fill();
  // face
  c.fillStyle='#fff';c.beginPath();c.arc(-5*sc,-80*sc+bob,4*sc,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(5*sc,-80*sc+bob,4*sc,0,Math.PI*2);c.fill();
  c.fillStyle=h.dark;c.beginPath();c.arc(-4*sc,-79*sc+bob,2.5*sc,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(6*sc,-79*sc+bob,2.5*sc,0,Math.PI*2);c.fill();
  // element hair
  if(h.elem==='Fire'){c.fillStyle='#ffcc00';c.beginPath();c.moveTo(-8*sc,-91*sc+bob);c.lineTo(0,-106*sc+bob);c.lineTo(8*sc,-91*sc+bob);c.closePath();c.fill();}
  if(h.elem==='Galaxy'){for(let s2=0;s2<4;s2++){const a=t*.07+s2*1.57;c.fillStyle='#ccaaff';c.globalAlpha=.8;c.beginPath();c.arc(Math.cos(a)*19*sc,-78*sc+bob+Math.sin(a)*8*sc,2.5*sc,0,Math.PI*2);c.fill();}c.globalAlpha=1;}
  if(h.elem==='Lightning'){c.fillStyle='#ffee00';[[-9,-92],[-4,-98],[4,-98],[9,-92]].forEach(([hx,hy])=>{c.beginPath();c.moveTo(hx*sc-3*sc,-90*sc+bob);c.lineTo(hx*sc,hy*sc+bob);c.lineTo(hx*sc+3*sc,-90*sc+bob);c.closePath();c.fill();});}
  if(h.elem==='Void'){c.fillStyle='rgba(0,0,0,.75)';c.beginPath();c.arc(0,-78*sc+bob,13*sc,Math.PI,0);c.fill();c.shadowBlur=8;c.shadowColor=h.glow;c.fillStyle=h.glow;c.globalAlpha=.7;c.beginPath();c.arc(-5*sc,-81*sc+bob,3.5*sc,0,Math.PI*2);c.fill();c.beginPath();c.arc(5*sc,-81*sc+bob,3.5*sc,0,Math.PI*2);c.fill();c.globalAlpha=1;c.shadowBlur=0;}
  c.restore();
}

// ─── DRAW HERO FROM BACK ───
function drawHeroBack(c,x,y,t,h,sc){
  c.save();c.translate(x,y);
  const leg=Math.sin(t*.28)*18;
  const arm=Math.cos(t*.28)*16;
  const bob=jumping?0:Math.abs(Math.sin(t*.28))*-4;

  // feet/shoes
  c.save();c.translate(-11*sc,bob);c.rotate(leg*Math.PI/180);
  c.fillStyle='#111';c.beginPath();c.roundRect(-7*sc,-8*sc,16*sc,9*sc,3);c.fill();
  c.fillStyle=h.col;c.beginPath();c.roundRect(-5*sc,-30*sc,10*sc,24*sc,4);c.fill();c.restore();
  c.save();c.translate(11*sc,bob);c.rotate(-leg*Math.PI/180);
  c.fillStyle='#111';c.beginPath();c.roundRect(-7*sc,-8*sc,16*sc,9*sc,3);c.fill();
  c.fillStyle=h.col;c.beginPath();c.roundRect(-5*sc,-30*sc,10*sc,24*sc,4);c.fill();c.restore();

  // body
  c.fillStyle=h.col;c.beginPath();c.roundRect(-16*sc,-74*sc+bob,32*sc,46*sc,6);c.fill();
  // backpack — 3D looking
  c.fillStyle=h.dark;c.beginPath();c.roundRect(-11*sc,-70*sc+bob,22*sc,34*sc,5);c.fill();
  c.fillStyle=h.col2;c.globalAlpha=.5;c.beginPath();c.roundRect(-11*sc,-70*sc+bob,22*sc,8*sc,5);c.fill();c.globalAlpha=1;
  // straps
  c.strokeStyle=h.col;c.lineWidth=2.5*sc;
  c.beginPath();c.moveTo(-9*sc,-70*sc+bob);c.lineTo(-14*sc,-52*sc+bob);c.stroke();
  c.beginPath();c.moveTo(9*sc,-70*sc+bob);c.lineTo(14*sc,-52*sc+bob);c.stroke();
  // arms
  c.strokeStyle=h.col;c.lineWidth=11*sc;c.lineCap='round';
  c.save();c.translate(-16*sc,-60*sc+bob);c.rotate(arm*Math.PI/180);c.beginPath();c.moveTo(0,0);c.lineTo(-10*sc,26*sc);c.stroke();c.restore();
  c.save();c.translate(16*sc,-60*sc+bob);c.rotate(-arm*Math.PI/180);c.beginPath();c.moveTo(0,0);c.lineTo(10*sc,26*sc);c.stroke();c.restore();
  // head
  c.fillStyle=h.col;c.beginPath();c.arc(0,-88*sc+bob,18*sc,0,Math.PI*2);c.fill();

  if(h.elem==='Fire'){
    c.fillStyle='#ffcc00';c.beginPath();c.moveTo(-10*sc,-104*sc+bob);c.lineTo(0,-122*sc+bob);c.lineTo(10*sc,-104*sc+bob);c.closePath();c.fill();
    c.fillStyle='#ff5500';c.beginPath();c.moveTo(-5*sc,-106*sc+bob);c.lineTo(0,-118*sc+bob);c.lineTo(5*sc,-106*sc+bob);c.closePath();c.fill();
    for(let f=0;f<6;f++){c.globalAlpha=(.5-f*.07)*Math.abs(Math.sin(t*.1+f));c.fillStyle=f%2?'#ff6600':'#ffaa00';c.beginPath();c.arc((f%3-1)*8*sc,(f*10+8)*sc,(5-f*.6)*sc,0,Math.PI*2);c.fill();}c.globalAlpha=1;
  } else if(h.elem==='Galaxy'){
    for(let s2=0;s2<5;s2++){const a=t*.07+s2*1.26;c.globalAlpha=.6+Math.sin(t*.08+s2)*.3;c.fillStyle=s2%2?'#cc88ff':'#fff';c.beginPath();c.arc(Math.cos(a)*24*sc,-88*sc+bob+Math.sin(a)*10*sc,3*sc,0,Math.PI*2);c.fill();}c.globalAlpha=1;
    for(let f=0;f<5;f++){c.globalAlpha=(.35-f*.06);c.fillStyle='#aa66ff';c.beginPath();c.arc((f%3-1)*8*sc,(f*11)*sc,3.5*sc,0,Math.PI*2);c.fill();}c.globalAlpha=1;
  } else if(h.elem==='Lightning'){
    c.fillStyle='#ffee00';[[-11,-104],[-5,-112],[0,-116],[5,-112],[11,-104]].forEach(([hx,hy])=>{c.beginPath();c.moveTo(hx*sc-3*sc,-102*sc+bob);c.lineTo(hx*sc,hy*sc+bob);c.lineTo(hx*sc+3*sc,-102*sc+bob);c.closePath();c.fill();});
    if(Math.floor(t*.15)%2===0){c.strokeStyle='#ffff00';c.lineWidth=2.5*sc;c.globalAlpha=.85;c.beginPath();c.moveTo(-22*sc,-58*sc+bob);c.lineTo(-13*sc,-44*sc+bob);c.lineTo(-20*sc,-33*sc+bob);c.stroke();c.globalAlpha=1;}
  } else {
    c.fillStyle='rgba(0,0,0,.75)';c.beginPath();c.arc(0,-88*sc+bob,16*sc,Math.PI,0);c.fill();
    c.shadowBlur=10;c.shadowColor=h.glow;c.fillStyle=h.glow;c.globalAlpha=.65;
    c.beginPath();c.arc(-6*sc,-91*sc+bob,4*sc,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(6*sc,-91*sc+bob,4*sc,0,Math.PI*2);c.fill();
    c.globalAlpha=1;c.shadowBlur=0;
    for(let v=0;v<3;v++){c.globalAlpha=(.2-v*.05)*Math.abs(Math.sin(t*.06+v));c.strokeStyle='#8800ff';c.lineWidth=1.5;c.beginPath();c.arc(0,-10*sc,(18+v*14)*sc,0,Math.PI*2);c.stroke();}c.globalAlpha=1;
  }
  c.restore();
}

// ═══════════════════════════════════════════════════
// COUNTDOWN
// ═══════════════════════════════════════════════════
function startCD(){
  Object.values(cAFs).forEach(cancelAnimationFrame);cAFs={};
  showScreen('game');initGame();
  let n=3;const el=document.getElementById('cdN');
  el.className='';el.textContent=n;el.style.color='#fff';void el.offsetWidth;el.classList.add('show');
  const iv=setInterval(()=>{el.classList.remove('show');setTimeout(()=>{n--;
    if(n>0){el.textContent=n;el.classList.add('show');}
    else{el.textContent='GO!';el.className='show go';setTimeout(()=>{el.classList.remove('show');clearInterval(iv);running=true;},700);}
  },300);},900);
}

// ═══════════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════════
const gc=document.getElementById('gc');
const gx=gc.getContext('2d');
let W,H,running=false,raf;
let score=0,lives=3,spd=5,frame=0;
let lane=1;
let pX=0,pTargetX=0,pY=0;
let jumpY=0,velY=0,jumping=false;
let sliding=false,slideT=0,invincible=0;
let obstacles=[],coins=[],particles=[];
let spawnT=0,spawnRate=95;
let reyshiClose=0,reyshiAnim=0;
let attackActive=0,bgScroll=0,treeScroll=0;

// ── PERSPECTIVE — close camera, player big at bottom ──
// Horizon at 30% of screen, road bottom at 84%, wide road
const VPY = ()=>H*0.30;
const RDY = ()=>H*0.84;
const TWH = ()=>W*0.065;  // road half-width at horizon
const BWH = ()=>W*0.56;   // road half-width at bottom (wider = bigger objects)

function rX(laneIdx,t){const tw=TWH(),bw=BWH();return W/2+(laneIdx-1)*((bw-(bw-tw)*t)*0.78);}
function rY(t){return RDY()-(RDY()-VPY())*t;}
function rS(t){return Math.max(0.03,1-t*0.97);}
function laneX(l){return rX(l,0);}

function resize(){
  W=gc.width=innerWidth;H=gc.height=innerHeight;
  pY=RDY()-4;
  pTargetX=laneX(lane);pX=pTargetX;
}

function initGame(){
  resize();score=0;lives=3;spd=5;frame=0;
  jumping=false;sliding=false;invincible=0;slideT=0;jumpY=0;velY=0;
  lane=1;pTargetX=laneX(1);pX=pTargetX;
  obstacles=[];coins=[];particles=[];
  spawnT=0;spawnRate=95;reyshiClose=0;reyshiAnim=0;
  attackActive=0;bgScroll=0;treeScroll=0;
  running=false;updateHUD();buildHearts();
  if(raf)cancelAnimationFrame(raf);
  loop();
}

function loop(){
  raf=requestAnimationFrame(loop);
  gx.clearRect(0,0,W,H);
  if(running){
    frame++;score+=spd*.04;spd+=.0006;
    spawnRate=Math.max(55,95-score*.18);
    spawnT++;if(spawnT>=spawnRate){spawnT=0;doSpawn();}
    moveObjs();checkHits();updateHUD();
    bgScroll+=spd;treeScroll+=spd*.007;
    reyshiClose=Math.min(.95,reyshiClose+.00012*(1+score/220));
    reyshiAnim+=.28;
    if(attackActive>0)attackActive--;
  }
  drawBG();
  drawRoad();
  drawScenery();
  drawReyshi();
  draw3DCoins();
  draw3DObstacles();
  drawPlayer();
  drawAttackFX();
  drawParticles();
  drawHUD3D();
}

// ═══════════════════════════════════════════════════
// HERO-THEMED BACKGROUNDS
// ═══════════════════════════════════════════════════
function drawBG(){
  const vpy=VPY();
  const hi=selHero<0?0:selHero;
  if(hi===0){
    // FIRE
    const g=gx.createLinearGradient(0,0,0,vpy+80);
    g.addColorStop(0,'#0f0200');g.addColorStop(.5,'#6a1000');g.addColorStop(1,'#dd5500');
    gx.fillStyle=g;gx.fillRect(0,0,W,vpy+80);
    gx.save();gx.shadowBlur=80;gx.shadowColor='#ff4400';gx.fillStyle='#ff7700';
    gx.beginPath();gx.arc(W*.5,vpy*.18,48,0,Math.PI*2);gx.fill();gx.restore();
    for(let r=0;r<8;r++){const a=r/8*Math.PI*2+frame*.007;gx.save();gx.globalAlpha=.14+Math.sin(frame*.04+r)*.07;gx.strokeStyle='#ff6600';gx.lineWidth=7;gx.beginPath();gx.moveTo(W*.5,vpy*.18);gx.lineTo(W*.5+Math.cos(a)*80,vpy*.18+Math.sin(a)*80);gx.stroke();gx.restore();}
    for(let e=0;e<14;e++){const ex=((e/14*W+bgScroll*.35+e*77)%W);const ey=vpy*(.04+Math.sin(frame*.02+e)*.1+e*.065);gx.save();gx.globalAlpha=.5+Math.sin(frame*.06+e)*.35;gx.fillStyle=e%3===0?'#ff3300':e%3===1?'#ff7700':'#ffcc00';gx.beginPath();gx.arc(ex,ey,2.5+Math.sin(e),0,Math.PI*2);gx.fill();gx.restore();}
    gx.fillStyle='rgba(255,70,0,.22)';[[.1,.18,200,70],[.42,.09,250,80],[.72,.16,180,62]].forEach(([fx,fy,cw,ch])=>{const cx=((fx*W-bgScroll*.1)%W+W)%W;blot(cx,vpy*fy,cw,ch);if(cx<cw)blot(cx+W,vpy*fy,cw,ch);});
  } else if(hi===1){
    // GALAXY
    const g=gx.createLinearGradient(0,0,0,vpy+80);
    g.addColorStop(0,'#000005');g.addColorStop(.5,'#08001e');g.addColorStop(1,'#160040');
    gx.fillStyle=g;gx.fillRect(0,0,W,vpy+80);
    for(let s=0;s<90;s++){const sx=s*137.5%W;const sy=s*97.3%(vpy*.9);gx.globalAlpha=.25+Math.sin(frame*.025+s*.5)*.2;gx.fillStyle=s%5===0?'#cc88ff':s%5===1?'#88aaff':s%5===2?'#ffaaff':s%5===3?'#aaffcc':'#fff';gx.beginPath();gx.arc(sx,sy,.5+Math.sin(s+frame*.01)*.5,0,Math.PI*2);gx.fill();}gx.globalAlpha=1;
    const vx=W*.5,vy=vpy*.28;const vR=gx.createRadialGradient(vx,vy,0,vx,vy,90);vR.addColorStop(0,'#220044');vR.addColorStop(.5,'#440088');vR.addColorStop(.8,'#8800ff55');vR.addColorStop(1,'transparent');gx.fillStyle=vR;gx.beginPath();gx.arc(vx,vy,90,0,Math.PI*2);gx.fill();
    for(let r=0;r<3;r++){gx.save();gx.translate(vx,vy);gx.rotate(frame*.01*(r+1));gx.strokeStyle=`rgba(${120+r*50},0,${220-r*40},.3)`;gx.lineWidth=1.5;gx.setLineDash([10,14]);gx.beginPath();gx.arc(0,0,55+r*22,0,Math.PI*2);gx.stroke();gx.setLineDash([]);gx.restore();}
  } else if(hi===2){
    // LIGHTNING STORM
    const g=gx.createLinearGradient(0,0,0,vpy+80);
    g.addColorStop(0,'#020208');g.addColorStop(.4,'#12122a');g.addColorStop(1,'#20201a');
    gx.fillStyle=g;gx.fillRect(0,0,W,vpy+80);
    gx.fillStyle='rgba(22,22,44,.92)';[[.04,.14,250,95],[.32,.06,290,105],[.62,.12,230,88],[.86,.08,210,82]].forEach(([fx,fy,cw,ch])=>{const cx=((fx*W-bgScroll*.07)%W+W)%W;blot(cx,vpy*fy,cw,ch);if(cx<cw)blot(cx+W,vpy*fy,cw,ch);});
    if(Math.sin(frame*.07)>.72){gx.save();gx.globalAlpha=.25+Math.sin(frame*.2)*.15;gx.fillStyle='#ffffbb';gx.fillRect(0,0,W,vpy+80);gx.restore();}
    const ltX=W*(.25+Math.sin(frame*.011)*.4);
    if(Math.floor(frame/16)%4===0){gx.save();gx.strokeStyle='#ffff44';gx.lineWidth=3.5;gx.shadowBlur=22;gx.shadowColor='#ffff00';gx.globalAlpha=.95;gx.beginPath();gx.moveTo(ltX,0);gx.lineTo(ltX-12,vpy*.28);gx.lineTo(ltX+9,vpy*.28);gx.lineTo(ltX-6,vpy*.6);gx.stroke();gx.lineWidth=1.2;gx.strokeStyle='#fff';gx.beginPath();gx.moveTo(ltX,0);gx.lineTo(ltX-6,vpy*.6);gx.stroke();gx.restore();}
    for(let e=0;e<10;e++){const ex=((e/10*W+bgScroll*.4+e*58)%W);const ey=vpy*(.08+e*.085);gx.save();gx.globalAlpha=.45+Math.sin(frame*.1+e)*.3;gx.fillStyle=e%2?'#ffff00':'#88ffff';gx.beginPath();gx.arc(ex,ey,1.8,0,Math.PI*2);gx.fill();gx.restore();}
  } else {
    // VOID
    const g=gx.createLinearGradient(0,0,0,vpy+80);
    g.addColorStop(0,'#000000');g.addColorStop(.5,'#040010');g.addColorStop(1,'#0c0020');
    gx.fillStyle=g;gx.fillRect(0,0,W,vpy+80);
    for(let s=0;s<55;s++){const sx=s*173%W;const sy=s*89%(vpy*.95);gx.globalAlpha=.08+Math.sin(frame*.02+s)*.08;gx.fillStyle=s%3===0?'#440066':'#220033';gx.beginPath();gx.arc(sx,sy,1+Math.sin(s)*.5,0,Math.PI*2);gx.fill();}gx.globalAlpha=1;
    const vx2=W*.5,vy2=vpy*.26;const vR2=gx.createRadialGradient(vx2,vy2,0,vx2,vy2,75);vR2.addColorStop(0,'#000');vR2.addColorStop(.55,'#1a0035');vR2.addColorStop(.78,'#8800ff');vR2.addColorStop(1,'transparent');gx.fillStyle=vR2;gx.beginPath();gx.arc(vx2,vy2,75,0,Math.PI*2);gx.fill();
    for(let r=0;r<4;r++){gx.save();gx.translate(vx2,vy2);gx.rotate(frame*.012*(r+1)*(r%2?1:-1));gx.strokeStyle=`rgba(${80+r*40},0,${180-r*30},.25)`;gx.lineWidth=1.8;gx.setLineDash([6,12]);gx.beginPath();gx.arc(0,0,40+r*18,0,Math.PI*2);gx.stroke();gx.setLineDash([]);gx.restore();}
    for(let tv=0;tv<6;tv++){const txv=((tv/6*W+bgScroll*.14+tv*70)%W);const tyv=vpy*(.03+Math.abs(Math.sin(frame*.02+tv))*.55);gx.save();gx.globalAlpha=.18+Math.sin(frame*.04+tv)*.08;gx.strokeStyle='#6600cc';gx.lineWidth=1.5;gx.beginPath();gx.moveTo(txv,0);gx.lineTo(txv+Math.sin(frame*.05+tv)*18,tyv);gx.stroke();gx.restore();}
  }
}
function blot(cx,cy,w,h){gx.beginPath();gx.ellipse(cx,cy,w*.42,h*.62,0,0,Math.PI*2);gx.ellipse(cx+w*.26,cy-h*.09,w*.36,h*.56,0,0,Math.PI*2);gx.ellipse(cx-w*.24,cy+h*.06,w*.3,h*.5,0,0,Math.PI*2);gx.ellipse(cx+w*.52,cy+h*.09,w*.28,h*.44,0,0,Math.PI*2);gx.fill();}

// ═══════════════════════════════════════════════════
// ROAD — coloured to match hero
// ═══════════════════════════════════════════════════
function drawRoad(){
  const vpy=VPY(),rdy=RDY(),tw=TWH(),bw=BWH();
  const hi=selHero<0?0:selHero;
  const groundC=['#3d1000','#080018','#0c0c18','#000008'][hi];
  const roadC1= ['#5a1800','#0e0030','#18182e','#06000e'][hi];
  const roadC2= ['#7a2400','#140040','#22223c','#0c001c'][hi];
  gx.fillStyle=groundC;gx.fillRect(0,vpy-5,W,H-vpy+5);
  const rg=gx.createLinearGradient(0,vpy,0,rdy);
  rg.addColorStop(0,roadC1);rg.addColorStop(.4,roadC2);rg.addColorStop(1,roadC1);
  gx.fillStyle=rg;
  gx.beginPath();gx.moveTo(W/2-tw,vpy);gx.lineTo(W/2+tw,vpy);gx.lineTo(W/2+bw,rdy);gx.lineTo(W/2-bw,rdy);gx.closePath();gx.fill();
  drawRails();
}

function drawRails(){
  const vpy=VPY(),rdy=RDY(),tw=TWH(),bw=BWH();
  const hi=selHero<0?0:selHero;
  const railC=['#5a2a10','#1a0a3a','#1e1e30','#14002a'][hi];
  const shineC=['rgba(180,120,80,.4)','rgba(80,40,140,.4)','rgba(80,80,140,.4)','rgba(80,0,120,.4)'][hi];

  // 4 rails for 3 lanes
  [-0.78,-0.26,0.26,0.78].forEach(frac=>{
    const xt=W/2+frac*tw, xb=W/2+frac*bw;
    gx.strokeStyle=railC;gx.lineWidth=4;gx.beginPath();gx.moveTo(xt,vpy);gx.lineTo(xb,rdy);gx.stroke();
    gx.strokeStyle=shineC;gx.lineWidth=2;gx.beginPath();gx.moveTo(xt+1,vpy);gx.lineTo(xb+2,rdy);gx.stroke();
  });
  // animated cross-ties
  for(let i=0;i<16;i++){
    const tt=((i/16)+(bgScroll*.005)%1)%1;
    if(tt<0.02)continue;
    const ty=rY(1-tt);
    const hw=TWH()+(BWH()-TWH())*(1-tt);
    const al=Math.min(1,tt*3)*.45;const lw=Math.max(1,(1-tt)*6+1);
    gx.strokeStyle=`rgba(80,55,30,${al})`;gx.lineWidth=lw;
    gx.beginPath();gx.moveTo(W/2-hw,ty);gx.lineTo(W/2+hw,ty);gx.stroke();
  }
}

// ═══════════════════════════════════════════════════
// SCENERY
// ═══════════════════════════════════════════════════
function drawScenery(){
  const vpy=VPY(),rdy=RDY(),tw=TWH(),bw=BWH();
  const hi=selHero<0?0:selHero;
  [0,.13,.27,.41,.55,.69,.83,.96].forEach((base,i)=>{
    const t2=((base+treeScroll)%1);
    const gy=vpy+(rdy-vpy)*t2;const sc2=0.07+t2*.93;
    const hw=tw+(bw-tw)*t2;
    const lx=W/2-hw-14*sc2;const rx=W/2+hw+14*sc2;
    if(hi===0){dFireTree(lx,gy,sc2);dFireTree(rx,gy,sc2);}
    else if(hi===1){dGalaxyPillar(lx,gy,sc2,i);dGalaxyPillar(rx,gy,sc2,i+3);}
    else if(hi===2){dStormPole(lx,gy,sc2);dStormPole(rx,gy,sc2);}
    else{dVoidPillar(lx,gy,sc2,i);dVoidPillar(rx,gy,sc2,i+2);}
  });
}
function dFireTree(x,y,sc){gx.fillStyle='#5a1800';gx.beginPath();gx.roundRect(x-5*sc,y-70*sc,9*sc,70*sc,2);gx.fill();gx.fillStyle='#cc3300';[[0,-70],[16,-58],[24,-46],[-16,-58],[-24,-46],[8,-80],[-8,-80]].forEach(([lx,ly])=>{gx.beginPath();gx.ellipse(x+lx*sc,y+ly*sc,14*sc,6*sc,lx*.04,0,Math.PI*2);gx.fill();});}
function dGalaxyPillar(x,y,sc,seed){const h=(60+(seed*53%70))*sc;gx.fillStyle=`hsl(${260+seed*20},60%,${15+seed*5%12}%)`;gx.beginPath();gx.roundRect(x-6*sc,y-h,12*sc,h,3);gx.fill();gx.fillStyle=`rgba(180,100,255,.2)`;gx.beginPath();gx.roundRect(x-6*sc,y-h,12*sc,h*.3,3);gx.fill();}
function dStormPole(x,y,sc){gx.fillStyle='#1a1a2a';gx.beginPath();gx.roundRect(x-4*sc,y-80*sc,8*sc,80*sc,2);gx.fill();gx.fillStyle='#ffff44';gx.shadowBlur=8;gx.shadowColor='#ffff00';gx.beginPath();gx.arc(x,y-80*sc,5*sc,0,Math.PI*2);gx.fill();gx.shadowBlur=0;}
function dVoidPillar(x,y,sc,seed){const h=(55+(seed*47%65))*sc;gx.fillStyle='#0a0018';gx.beginPath();gx.roundRect(x-7*sc,y-h,14*sc,h,3);gx.fill();gx.strokeStyle='rgba(120,0,220,.35)';gx.lineWidth=1;gx.beginPath();gx.roundRect(x-7*sc,y-h,14*sc,h,3);gx.stroke();}

// ═══════════════════════════════════════════════════
// 3D COINS — big spinning discs like Subway Surfers
// ═══════════════════════════════════════════════════
function draw3DCoins(){
  [...coins].sort((a,b)=>b.t-a.t).forEach(c=>{
    if(c.collected||c.t<0.0||c.t>0.99)return;
    const cx=rX(c.l,c.t);
    const cy=rY(c.t);
    const s=rS(c.t);
    const R=38*s; // BIG coin radius
    const spin=frame*.08+c.t*4; // spinning angle
    const squeeze=Math.abs(Math.cos(spin)); // 0=edge-on, 1=face-on
    const coinY=cy-R*1.1; // float above rail level

    gx.save();
    gx.shadowBlur=14*s;gx.shadowColor='#ffd700';

    // 3D coin — draw as ellipse (squeezes as it spins to show depth)
    const faceW=R*Math.max(0.08,squeeze);
    const faceH=R;

    // SIDE/THICKNESS (dark gold) — draw when coin is edge-on
    if(squeeze<0.5){
      gx.fillStyle='#aa7700';
      gx.beginPath();gx.ellipse(cx,coinY,faceW+3*s,faceH+2*s,0,0,Math.PI*2);gx.fill();
    }

    // COIN FACE gradient
    const cg=gx.createRadialGradient(cx-faceW*.3,coinY-faceH*.3,0,cx,coinY,Math.max(faceW,faceH));
    cg.addColorStop(0,'#fff8a0');cg.addColorStop(.4,'#ffd700');cg.addColorStop(.75,'#cc9900');cg.addColorStop(1,'#886600');
    gx.fillStyle=cg;
    gx.beginPath();gx.ellipse(cx,coinY,faceW,faceH,0,0,Math.PI*2);gx.fill();

    // STAR symbol on face
    if(squeeze>0.3){
      const starAlpha=Math.min(1,(squeeze-.3)/.7);
      gx.globalAlpha=starAlpha;
      gx.fillStyle='#ffee55';
      drawStar(gx,cx,coinY,R*.44*squeeze,R*.22*squeeze,5);
      // shine
      gx.fillStyle='rgba(255,255,255,.55)';
      gx.beginPath();gx.ellipse(cx-faceW*.2,coinY-faceH*.25,faceW*.3,faceH*.2,-.4,0,Math.PI*2);gx.fill();
      gx.globalAlpha=1;
    }

    // ground shadow
    gx.globalAlpha=.3;gx.fillStyle='#000';
    gx.beginPath();gx.ellipse(cx,cy,R*.55,R*.12,0,0,Math.PI*2);gx.fill();
    gx.globalAlpha=1;
    gx.restore();
  });
}

function drawStar(c,x,y,r1,r2,pts){
  c.beginPath();
  for(let i=0;i<pts*2;i++){
    const a=i/pts*Math.PI-Math.PI/2;
    const r=i%2===0?r1:r2;
    i===0?c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
  }
  c.closePath();c.fill();
}

// ═══════════════════════════════════════════════════
// 3D OBSTACLES — trains / spikes / bars, big and clear
// ═══════════════════════════════════════════════════
function draw3DObstacles(){
  [...obstacles].sort((a,b)=>b.t-a.t).forEach(o=>{
    if(o.t<0.0||o.t>0.99)return;
    const ox=rX(o.l,o.t);
    const oy=rY(o.t);
    const s=rS(o.t);
    const isClose=o.t<0.22;
    const hi=selHero<0?0:selHero;

    gx.save();

    // ── LANE DANGER STRIPE — coloured path on ground to player ──
    if(o.t<0.72){
      const nearX=laneX(o.l),nearY=pY;
      const farX=ox,farY=oy;
      const nW=BWH()*.78*rS(0),fW=(TWH()+(BWH()-TWH())*o.t)*.78*s;
      const col=o.type==='barrier'?'#ff5500':o.type==='spike'?'#ff1133':'#ffaa00';
      const lAlpha=Math.min(0.28,(0.72-o.t)*.5)*(isClose?.6+Math.sin(frame*.4)*.4:1);
      gx.globalAlpha=lAlpha;gx.fillStyle=col;
      gx.beginPath();gx.moveTo(farX-fW/2,farY);gx.lineTo(farX+fW/2,farY);gx.lineTo(nearX+nW/2,nearY);gx.lineTo(nearX-nW/2,nearY);gx.closePath();gx.fill();
      gx.globalAlpha=1;
    }

    if(o.type==='barrier'){
      // ── 3D TRAIN ──
      const w=72*s, h=80*s, d=20*s; // width, height, depth
      const topY=oy-h;
      const faceX=ox-w/2;

      // TRAIN SHADOW on ground
      gx.globalAlpha=.25;gx.fillStyle='#000';
      gx.beginPath();gx.ellipse(ox,oy,w*.5,7*s,0,0,Math.PI*2);gx.fill();gx.globalAlpha=1;

      // TRAIN TOP face (3D top)
      const hi2=selHero<0?0:selHero;
      const trainCol=['#2a2a44','#1a0a3a','#22223a','#0e0018'][hi2];
      const trainSide=['#1a1a30','#10062a','#16162a','#08000e'][hi2];
      const trainTop=['#3a3a55','#280e4a','#30304a','#180025'][hi2];
      gx.fillStyle=trainTop;
      gx.beginPath();gx.moveTo(faceX,topY);gx.lineTo(faceX+w,topY);gx.lineTo(faceX+w+d,topY-d*.5);gx.lineTo(faceX+d,topY-d*.5);gx.closePath();gx.fill();
      // TRAIN SIDE (right)
      gx.fillStyle=trainSide;
      gx.beginPath();gx.moveTo(faceX+w,topY);gx.lineTo(faceX+w+d,topY-d*.5);gx.lineTo(faceX+w+d,oy-d*.5);gx.lineTo(faceX+w,oy);gx.closePath();gx.fill();
      // TRAIN FRONT face
      gx.fillStyle=trainCol;
      gx.beginPath();gx.roundRect(faceX,topY,w,h,4);gx.fill();
      // windows on front
      const winC='rgba(180,220,255,.25)';
      gx.fillStyle=winC;
      const ww=w*.22,wh=h*.2;
      gx.beginPath();gx.roundRect(faceX+w*.08,topY+h*.12,ww,wh,3);gx.fill();
      gx.beginPath();gx.roundRect(faceX+w*.38,topY+h*.12,ww,wh,3);gx.fill();
      gx.beginPath();gx.roundRect(faceX+w*.68,topY+h*.12,ww,wh,3);gx.fill();
      // headlight glow
      gx.save();gx.shadowBlur=18*s;gx.shadowColor='#ffff88';gx.fillStyle='#ffffcc';
      gx.beginPath();gx.ellipse(faceX+w*.2,oy-h*.18,8*s,6*s,0,0,Math.PI*2);gx.fill();
      gx.beginPath();gx.ellipse(faceX+w*.8,oy-h*.18,8*s,6*s,0,0,Math.PI*2);gx.fill();gx.restore();
      // red stripe
      gx.fillStyle='#cc2200';gx.beginPath();gx.roundRect(faceX,oy-h*.32,w,h*.1,[0,0,0,0]);gx.fill();
      // TOP yellow cap
      gx.fillStyle='#ffcc00';gx.beginPath();gx.roundRect(faceX,topY,w,5*s,[4,4,0,0]);gx.fill();
      // JUMP label — BIG, bold, with shadow
      const fs=Math.max(13,22*s);
      gx.font=`900 ${fs}px Nunito`;gx.textAlign='center';
      gx.fillStyle='#000';gx.fillText('↑ JUMP',ox+1,topY-7*s+1);
      gx.fillStyle='#ffffff';gx.shadowBlur=4;gx.shadowColor='#000';gx.fillText('↑ JUMP',ox,topY-7*s);gx.shadowBlur=0;

    } else if(o.type==='spike'){
      // ── 3D SPIKES ──
      const bw=74*s;
      // base plate — 3D box
      gx.fillStyle='#3a0010';gx.beginPath();gx.roundRect(ox-bw/2,oy-6*s,bw,6*s,2);gx.fill();
      // base side
      gx.fillStyle='#220008';gx.beginPath();gx.moveTo(ox-bw/2,oy-6*s);gx.lineTo(ox-bw/2+8*s,oy-10*s);gx.lineTo(ox+bw/2+8*s,oy-10*s);gx.lineTo(ox+bw/2,oy-6*s);gx.closePath();gx.fill();
      // spikes — 3D pyramids
      const n=4,sw=bw/n;
      for(let i=0;i<n;i++){
        const sx=ox-bw/2+i*sw+sw/2;
        const sh=56*s;
        // right face (darker)
        gx.fillStyle='#aa0018';gx.beginPath();gx.moveTo(sx,oy-6*s-sh);gx.lineTo(sx+sw*.44,oy-6*s);gx.lineTo(sx,oy-6*s-sh*.5);gx.closePath();gx.fill();
        // left face (brighter)
        gx.fillStyle=i%2?'#ff1133':'#ff3355';
        gx.beginPath();gx.moveTo(sx,oy-6*s-sh);gx.lineTo(sx-sw*.44,oy-6*s);gx.lineTo(sx,oy-6*s-sh*.5);gx.closePath();gx.fill();
        // highlight shine on tip
        gx.fillStyle='rgba(255,200,200,.35)';gx.beginPath();gx.moveTo(sx,oy-6*s-sh);gx.lineTo(sx-sw*.08,oy-6*s-sh*.6);gx.lineTo(sx+sw*.04,oy-6*s-sh*.6);gx.closePath();gx.fill();
      }
      gx.globalAlpha=.22;gx.fillStyle='#000';gx.beginPath();gx.ellipse(ox,oy,bw*.38,5*s,0,0,Math.PI*2);gx.fill();gx.globalAlpha=1;
      const fs2=Math.max(12,20*s);
      gx.font=`900 ${fs2}px Nunito`;gx.textAlign='center';
      gx.fillStyle='#000';gx.fillText('↑ JUMP',ox+1,oy-6*s-56*s-6*s+1);
      gx.fillStyle='#fff';gx.shadowBlur=4;gx.shadowColor='#000';gx.fillText('↑ JUMP',ox,oy-6*s-56*s-6*s);gx.shadowBlur=0;

    } else if(o.type==='lowbar'){
      // ── 3D LOW BAR ──
      const hw=54*s, ph=46*s;
      // posts — 3D cylinders (box approximation)
      [ox-hw, ox+hw].forEach(px2=>{
        // post side face
        gx.fillStyle='#885500';gx.beginPath();gx.roundRect(px2+4*s,oy-ph,5*s,ph,2);gx.fill();
        // post front face
        gx.fillStyle='#cc8800';gx.beginPath();gx.roundRect(px2-4*s,oy-ph,8*s,ph,2);gx.fill();
      });
      // bar — 3D box, player must duck under this
      const barY=oy-ph*.54;
      const barH=15*s;
      // bar top face
      gx.fillStyle='#dd9900';gx.beginPath();gx.moveTo(ox-hw,barY);gx.lineTo(ox+hw,barY);gx.lineTo(ox+hw+6*s,barY-5*s);gx.lineTo(ox-hw+6*s,barY-5*s);gx.closePath();gx.fill();
      // bar front face with stripes
      const barGrad=gx.createLinearGradient(ox-hw,0,ox+hw,0);
      barGrad.addColorStop(0,'#cc7700');barGrad.addColorStop(.5,'#ffaa00');barGrad.addColorStop(1,'#cc7700');
      gx.fillStyle=barGrad;gx.beginPath();gx.roundRect(ox-hw,barY,hw*2,barH,4);gx.fill();
      // diagonal stripes
      gx.save();gx.beginPath();gx.roundRect(ox-hw,barY,hw*2,barH,4);gx.clip();
      gx.globalAlpha=.22;gx.fillStyle='#000';
      for(let i=0;i<8;i++)gx.fillRect(ox-hw+i*16*s,barY,8*s,barH);
      gx.restore();
      // OPEN gap below bar — make it obvious there's space to slide through
      gx.globalAlpha=.12;gx.fillStyle='#00ff88';
      gx.beginPath();gx.roundRect(ox-hw,barY+barH,hw*2,oy-(barY+barH),3);gx.fill();
      gx.globalAlpha=1;
      // SLIDE label
      const fs3=Math.max(12,20*s);
      gx.font=`900 ${fs3}px Nunito`;gx.textAlign='center';
      gx.fillStyle='#000';gx.fillText('↓ SLIDE',ox+1,barY-6*s+1);
      gx.fillStyle='#fff';gx.shadowBlur=4;gx.shadowColor='#000';gx.fillText('↓ SLIDE',ox,barY-6*s);gx.shadowBlur=0;
    }
    gx.restore();
  });
}

// ═══════════════════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════════════════
function drawPlayer(){
  const h=HEROES[selHero]||HEROES[0];
  pTargetX=laneX(lane);pX+=(pTargetX-pX)*.18;
  if(jumping){velY+=.58;jumpY+=velY;if(jumpY>=0){jumpY=0;jumping=false;velY=0;}}
  if(sliding){slideT--;if(slideT<=0)sliding=false;}
  if(invincible>0)invincible--;
  const alpha=invincible>0?(.45+Math.sin(frame*.4)*.45):1;
  const fy=pY+jumpY;
  const sc=2.2;

  gx.save();gx.globalAlpha=alpha;
  gx.shadowBlur=22;gx.shadowColor=h.glow;

  // GROUND SHADOW (shrinks/fades when jumping — shows height clearly)
  const shadowDist=Math.abs(jumpY);
  const shadowSc=Math.max(0.25,1-shadowDist/150);
  gx.globalAlpha=alpha*.45*shadowSc;gx.fillStyle='rgba(0,0,0,.85)';
  gx.beginPath();gx.ellipse(pX,pY+4,34*shadowSc,9*shadowSc,0,0,Math.PI*2);gx.fill();
  gx.globalAlpha=alpha;

  if(sliding){
    // slide — flat crouched shape
    const sw=52;
    gx.shadowBlur=20;gx.shadowColor=h.glow;
    gx.fillStyle=h.col;gx.beginPath();gx.roundRect(pX-sw,fy-22,sw*2,24,10);gx.fill();
    gx.beginPath();gx.arc(pX+sw-12,fy-18,13,0,Math.PI*2);gx.fill();
    // 3D shine on slide
    gx.fillStyle='rgba(255,255,255,.2)';gx.beginPath();gx.roundRect(pX-sw+6,fy-22,sw*2-12,8,6);gx.fill();
    gx.globalAlpha=alpha*.35;gx.fillStyle='#000';gx.beginPath();gx.ellipse(pX,pY+4,sw*.75,7,0,0,Math.PI*2);gx.fill();gx.globalAlpha=alpha;
  } else {
    drawHeroBack(gx,pX,fy,frame,h,sc);
  }

  // element trail
  if(running&&frame%2===0){
    particles.push({x:pX+(-16+Math.random()*32),y:fy+Math.random()*14-5,vx:(Math.random()-.5)*2,vy:Math.random()*2+.6,life:22+Math.random()*16,max:38,col:h.glow,r:3+Math.random()*3});
  }
  gx.restore();
}

// ═══════════════════════════════════════════════════
// REYSHI — behind the player
// ═══════════════════════════════════════════════════
function drawReyshi(){
  const anger=Math.min(1,reyshiClose*1.1);
  const rsc=0.5+reyshiClose*.7;
  const t=reyshiAnim;
  const runB=Math.sin(t)*13*rsc;
  const bob=Math.sin(t*.7)*4*rsc;
  const ry=pY+H*.07+(1-reyshiClose)*H*.06;
  const rx=pX;
  if(ry>H*1.05)return;
  const rCol=`hsl(345,${62+anger*38}%,${30+anger*20}%)`;

  gx.save();gx.shadowBlur=18+anger*28;gx.shadowColor='#ff2244';
  gx.globalAlpha=.25;gx.fillStyle='#000';gx.beginPath();gx.ellipse(rx,ry+3,24*rsc,7*rsc,0,0,Math.PI*2);gx.fill();gx.globalAlpha=1;
  const ls=Math.sin(t)*15*rsc;
  ['l','r'].forEach((_,si)=>{
    const lx2=rx+(si===0?-10:10)*rsc;
    gx.save();gx.translate(lx2,ry);gx.rotate((si===0?ls:-ls)*Math.PI/180);
    gx.fillStyle=rCol;gx.beginPath();gx.roundRect(-4*rsc,0,8*rsc,20*rsc,3);gx.fill();
    gx.fillStyle='#2a0000';gx.beginPath();gx.roundRect(-5*rsc,18*rsc,12*rsc,7*rsc,2);gx.fill();gx.restore();
  });
  gx.fillStyle=rCol;gx.beginPath();gx.roundRect(rx-13*rsc,ry-44*rsc,26*rsc,36*rsc,5);gx.fill();
  gx.strokeStyle=rCol;gx.lineWidth=9*rsc;gx.lineCap='round';
  gx.beginPath();gx.moveTo(rx-13*rsc,ry-34*rsc);gx.lineTo(rx-28*rsc,ry-17*rsc+runB);gx.stroke();
  gx.beginPath();gx.moveTo(rx+13*rsc,ry-34*rsc);gx.lineTo(rx+28*rsc,ry-17*rsc-runB);gx.stroke();
  if(reyshiClose>.5){const ca=(reyshiClose-.5)*2*.9;gx.strokeStyle=`rgba(255,50,80,${ca})`;gx.lineWidth=2;for(let cc=0;cc<3;cc++){gx.beginPath();gx.moveTo(rx+28*rsc,ry-17*rsc-runB+cc*5*rsc);gx.lineTo(rx+40*rsc,ry-10*rsc-runB+cc*5*rsc);gx.stroke();}}
  gx.fillStyle=rCol;gx.beginPath();gx.arc(rx,ry-56*rsc+bob,15*rsc,0,Math.PI*2);gx.fill();
  gx.fillStyle='#660011';
  [[rx-8*rsc,ry-67*rsc+bob,rx-4*rsc,ry-84*rsc+bob,rx,ry-67*rsc+bob],[rx,ry-67*rsc+bob,rx+4*rsc,ry-84*rsc+bob,rx+8*rsc,ry-67*rsc+bob]].forEach(([x1,y1,x2,y2,x3,y3])=>{gx.beginPath();gx.moveTo(x1,y1);gx.lineTo(x2,y2);gx.lineTo(x3,y3);gx.closePath();gx.fill();});
  gx.shadowBlur=10+anger*14;gx.shadowColor='#ff0000';
  gx.fillStyle=`rgb(255,${Math.floor(160-anger*160)},0)`;
  gx.beginPath();gx.arc(rx-5*rsc,ry-57*rsc+bob,3*rsc,0,Math.PI*2);gx.fill();
  gx.beginPath();gx.arc(rx+5*rsc,ry-57*rsc+bob,3*rsc,0,Math.PI*2);gx.fill();gx.shadowBlur=0;
  const lAlpha=Math.min(1,reyshiClose*2);
  if(lAlpha>.08){gx.globalAlpha=lAlpha;gx.fillStyle='#ff2244';gx.font=`900 ${10*rsc+4}px Nunito`;gx.textAlign='center';gx.fillText('REYSHI',rx,ry-90*rsc+bob);}
  gx.restore();
}

// ═══════════════════════════════════════════════════
// ATTACK EFFECT
// ═══════════════════════════════════════════════════
function triggerAttack(){
  if(!running||attackActive>0)return;
  const h=HEROES[selHero]||HEROES[0];
  attackActive=55;reyshiClose=Math.max(0,reyshiClose-.35);
  const fl=document.getElementById('atkFlash');fl.style.background=h.atkCol+'44';fl.style.opacity='1';setTimeout(()=>fl.style.opacity='0',110);
  for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2;const sp=4+Math.random()*7;particles.push({x:pX,y:pY+jumpY-50,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:32+Math.random()*22,max:54,col:h.glow,r:5+Math.random()*6});}
  score+=25;
}
function drawAttackFX(){
  if(attackActive<=0)return;
  const h=HEROES[selHero]||HEROES[0];
  const prog=attackActive/55;const t=55-attackActive;
  gx.save();gx.globalAlpha=prog*.7;
  if(h.elem==='Fire'){const fy2=pY+jumpY-55-t*2.5;gx.shadowBlur=26;gx.shadowColor='#ff6600';gx.fillStyle='#ff4400';gx.beginPath();gx.arc(pX,fy2,20*prog,0,Math.PI*2);gx.fill();gx.fillStyle='#ffcc00';gx.beginPath();gx.arc(pX,fy2,11*prog,0,Math.PI*2);gx.fill();}
  else if(h.elem==='Galaxy'){for(let s2=0;s2<8;s2++){const a=t*.15+s2*.785;const r=(28+t*1.8)*prog;gx.globalAlpha=prog*.55;gx.fillStyle=s2%2?'#cc88ff':'#fff';gx.beginPath();gx.arc(pX+Math.cos(a)*r,pY+jumpY-55+Math.sin(a)*r*.4,5*prog,0,Math.PI*2);gx.fill();}}
  else if(h.elem==='Lightning'){gx.strokeStyle='#ffff00';gx.lineWidth=4*prog;gx.shadowBlur=22;gx.shadowColor='#ffff00';gx.beginPath();gx.moveTo(pX,pY+jumpY);for(let s3=0;s3<5;s3++)gx.lineTo(pX+(Math.random()-.5)*22,pY+jumpY+(s3+1)*20);gx.stroke();}
  else{gx.shadowBlur=28;gx.shadowColor='#8800ff';gx.strokeStyle='#cc00ff';gx.lineWidth=4*prog;for(let v=0;v<3;v++){gx.globalAlpha=prog*(1-v*.3)*.5;gx.beginPath();gx.arc(pX,pY+jumpY-55,(32+v*22+t*2)*prog,0,Math.PI*2);gx.stroke();}}
  gx.restore();
}

// ═══════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════
function drawParticles(){
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)return;gx.globalAlpha=(p.life/p.max)*.65;gx.fillStyle=p.col;gx.beginPath();gx.arc(p.x,p.y,p.r*(p.life/p.max),0,Math.PI*2);gx.fill();});
  particles=particles.filter(p=>p.life>0);gx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════
// HUD OVERLAYS — big lane panels + attack hint
// ═══════════════════════════════════════════════════
function drawHUD3D(){
  obstacles.forEach(o=>{
    if(o.t>0.82||o.t<0.0)return;
    const col=o.type==='lowbar'?'#ffaa00':o.type==='barrier'?'#ff5500':'#ff1133';
    const action=o.type==='lowbar'?'↓ SLIDE':'↑ JUMP';
    const fadeIn=Math.min(1,(0.82-o.t)/0.4);
    const urgent=o.t<0.22;
    const pulse=urgent?(.58+Math.sin(frame*.45)*.42):1;
    const alpha=fadeIn*pulse;
    if(alpha<0.04)return;
    const lx2=laneX(o.l);
    const pw=92,ph=54,py2=H-ph-10;
    const px2=lx2-pw/2;
    gx.save();gx.globalAlpha=alpha;
    // panel shadow
    gx.fillStyle='rgba(0,0,0,.4)';gx.beginPath();gx.roundRect(px2+4,py2+6,pw,ph,12);gx.fill();
    // panel bg
    gx.fillStyle=col;gx.shadowBlur=urgent?28:12;gx.shadowColor=col;
    gx.beginPath();gx.roundRect(px2,py2,pw,ph,12);gx.fill();gx.shadowBlur=0;
    // inner dark
    gx.fillStyle='rgba(0,0,0,.38)';gx.beginPath();gx.roundRect(px2+4,py2+4,pw-8,ph-8,9);gx.fill();
    // top shine
    gx.fillStyle='rgba(255,255,255,.18)';gx.beginPath();gx.roundRect(px2+6,py2+5,pw-12,10,6);gx.fill();
    // action text
    gx.fillStyle='#fff';gx.font='900 19px Nunito';gx.textAlign='center';gx.shadowBlur=5;gx.shadowColor='#000';
    gx.fillText(action,lx2,py2+22);gx.shadowBlur=0;
    // lane dots
    for(let li=0;li<3;li++){gx.fillStyle=li===o.l?'#fff':'rgba(255,255,255,.25)';gx.beginPath();gx.arc(lx2-20+li*20,py2+38,li===o.l?5.5:3.5,0,Math.PI*2);gx.fill();}
    // countdown bar
    gx.fillStyle='rgba(0,0,0,.35)';gx.beginPath();gx.roundRect(px2+8,py2+ph-11,pw-16,6,3);gx.fill();
    gx.fillStyle='#fff';gx.beginPath();gx.roundRect(px2+8,py2+ph-11,(pw-16)*(o.t/0.82),6,3);gx.fill();
    gx.restore();
  });

  // attack button
  if(running&&attackActive<=0){
    const h=HEROES[selHero]||HEROES[0];
    gx.save();
    gx.fillStyle='rgba(0,0,0,.5)';gx.beginPath();gx.roundRect(W-138,H-42,128,32,16);gx.fill();
    gx.fillStyle=h.atkCol;gx.font='700 12px Nunito';gx.textAlign='center';
    gx.fillText('F · '+h.atkName,W-74,H-22);gx.restore();
  }
}

// ═══════════════════════════════════════════════════
// SPAWN / MOVE / COLLIDE
// ═══════════════════════════════════════════════════
function doSpawn(){
  const types=['barrier','spike','lowbar'];
  const type=types[Math.floor(Math.random()*types.length)];
  const l=Math.floor(Math.random()*3);
  obstacles.push({type,l,t:0.97});
  if(Math.random()<.26){const l2=(l+1+Math.floor(Math.random()*2))%3;if(l2!==l)obstacles.push({type,l:l2,t:0.97});}
  if(Math.random()<.55){
    const cl=[0,1,2].find(x=>x!==l)??1;
    for(let i=0;i<5;i++)coins.push({l:cl,t:0.97-i*.04,collected:false});
  }
}
function moveObjs(){
  const dt=spd*.00032;
  obstacles.forEach(o=>{o.t-=dt;});obstacles=obstacles.filter(o=>o.t>-0.05);
  coins.forEach(c=>{if(!c.collected)c.t-=dt;});coins=coins.filter(c=>c.t>-0.05&&!c.collected);
}
function checkHits(){
  if(invincible>0)return;
  obstacles.forEach((o,i)=>{
    if(o.t>0.055||o.t<-0.02)return;if(o.l!==lane)return;
    let hit=false;
    if(o.type==='barrier'&&!jumping)hit=true;
    if(o.type==='spike'&&!jumping)hit=true;
    if(o.type==='lowbar'&&!sliding&&!jumping)hit=true;
    if(hit){obstacles.splice(i,1);takeDmg();}
  });
  coins.forEach(c=>{
    if(c.collected||c.t>0.055||c.t<-0.02)return;if(c.l!==lane)return;
    c.collected=true;score+=10;
    for(let k=0;k<8;k++)particles.push({x:pX+(-16+Math.random()*32),y:pY+jumpY-28,vx:(Math.random()-.5)*3.5,vy:-(Math.random()*2.5+1),life:22,max:22,col:'#ffd700',r:4});
  });
}
function takeDmg(){
  lives--;invincible=90;buildHearts();
  gc.style.transform='translateX(9px)';setTimeout(()=>gc.style.transform='translateX(-9px)',65);setTimeout(()=>gc.style.transform='',130);
  if(lives<=0)die();
}
function die(){
  running=false;const s=Math.floor(score);if(s>bestScore)bestScore=s;
  document.getElementById('goD').textContent=s+' M';
  document.getElementById('goB').textContent='Best: '+bestScore+' m';
  setTimeout(()=>showScreen('go'),500);
}
function updateHUD(){document.getElementById('hScore').textContent=Math.floor(score)+'m';}
function buildHearts(){const el=document.getElementById('hHearts');el.innerHTML='';for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart'+(i>=lives?' dead':'');h.textContent='❤';el.appendChild(h);}}

// ═══════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════
function doJump(){if(!running||jumping)return;jumping=true;velY=-(18*(HEROES[selHero]?.jMul||1));}
function doSlide(){if(!running||jumping)return;sliding=true;slideT=44;}
function doLeft(){if(!running)return;lane=Math.max(0,lane-1);}
function doRight(){if(!running)return;lane=Math.min(2,lane+1);}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){e.preventDefault();doJump();}
  if(e.key==='ArrowDown'||e.key==='s')doSlide();
  if(e.key==='ArrowLeft'||e.key==='a')doLeft();
  if(e.key==='ArrowRight'||e.key==='d')doRight();
  if(e.key==='f'||e.key==='F')triggerAttack();
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx<18&&ady<18){triggerAttack();return;}
  if(adx>ady){dx>0?doRight():doLeft();}else{dy<0?doJump():doSlide();}
});
addEventListener('resize',()=>{if(!document.getElementById('game').classList.contains('hidden'))resize();});
function restart(){startCD();}
showScreen('intro');
</script>

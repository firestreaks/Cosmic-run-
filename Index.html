<!DOCTYPE html>
<html>
<head>
<title>Mad Fire – Burning City</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#game{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* 🔥 Animated Burning Sky */
#background{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top,#1a0000,#660000,#ff3300);
  animation: skyPulse 4s infinite alternate;
}

@keyframes skyPulse{
  from{ filter:brightness(1); }
  to{ filter:brightness(1.2); }
}

/* 🌆 Moving Ground */
#ground{
  position:absolute;
  bottom:0;
  width:200%;
  height:150px;
  background:linear-gradient(to right,#111,#222,#111);
  animation: moveGround 2s linear infinite;
}

@keyframes moveGround{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

/* 🔥 Player */
#player{
  position:absolute;
  bottom:150px;
  left:50%;
  width:80px;
  height:100px;
  transform:translateX(-50%);
  transition:left 0.2s ease;
  filter: drop-shadow(0 0 20px orange);
}

/* 🚧 Obstacles */
.obstacle{
  position:absolute;
  bottom:150px;
  width:70px;
  height:90px;
  background:linear-gradient(red,darkred);
  border-radius:10px;
  box-shadow:0 0 20px red;
}

#score{
  position:absolute;
  top:15px;
  left:15px;
  color:white;
  font-size:22px;
}

</style>
</head>

<body>

<div id="game">
  <div id="background"></div>
  <div id="ground"></div>

  <div id="score">Score: 0</div>

  <!-- Replace with your ninja image -->
  <img id="player" src="https://i.imgur.com/6X12QxR.png">

</div>

<script>
let player = document.getElementById("player");
let game = document.getElementById("game");
let scoreDisplay = document.getElementById("score");

let lanes = [25,50,75];
let currentLane = 1;
let score = 0;
let speed = 6;
let running = true;

function setLane(){
  player.style.left = lanes[currentLane] + "%";
}
setLane();

/* Controls */
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft" && currentLane>0) currentLane--;
  if(e.key==="ArrowRight" && currentLane<2) currentLane++;
  setLane();
});

/* Obstacles */
function createObstacle(){
  let obs = document.createElement("div");
  obs.classList.add("obstacle");
  let lane = Math.floor(Math.random()*3);
  obs.style.left = lanes[lane] + "%";
  obs.style.bottom = "150px";
  obs.dataset.lane = lane;
  game.appendChild(obs);
}
setInterval(createObstacle,1000);

function loop(){
  if(!running) return;
  let obstacles = document.querySelectorAll(".obstacle");

  obstacles.forEach(obs=>{
    obs.style.bottom = (parseInt(obs.style.bottom)+speed) + "px";

    if(parseInt(obs.style.bottom) > window.innerHeight){
      obs.remove();
      score++;
      scoreDisplay.innerText="Score: "+score;
    }

    if(obs.dataset.lane==currentLane &&
       parseInt(obs.style.bottom) > window.innerHeight-260){
        running=false;
        alert("Game Over! Score: "+score);
        location.reload();
    }
  });

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>

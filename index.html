<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cosmic Mortal: First Person</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Rajdhani:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:#000;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;}
#game-wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
canvas{background:linear-gradient(#050010, #1a0020);display:block;box-shadow:0 0 50px rgba(187,68,255,0.2);}
#ui-layer{position:absolute;inset:0;pointer-events:none;}

/* Character Selection */
#menu{position:absolute;inset:0;background:radial-gradient(circle,#1a0020,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;}
h1{font-family:'Cinzel Decorative',serif;color:#bb44ff;font-size:42px;text-shadow:0 0 20px #bb44ff;margin-bottom:30px;}
.cards{display:flex;gap:20px;margin-bottom:30px;}
.card{width:200px;padding:20px;background:rgba(255,255,255,0.05);border:2px solid #444;border-radius:15px;text-align:center;cursor:pointer;transition:0.3s;}
.card:hover{border-color:#bb44ff;transform:translateY(-5px);}
.card.selected{border-color:#bb44ff;box-shadow:0 0 30px #bb44ff;background:rgba(187,68,255,0.1);}
.card h2{font-family:'Cinzel Decorative',serif;font-size:18px;margin-bottom:5px;}
.card p{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:2px;}

#start-btn{padding:12px 40px;border:2px solid #bb44ff;background:none;color:#fff;font-family:'Cinzel Decorative',serif;cursor:pointer;border-radius:50px;transition:0.3s;}
#start-btn:hover:not(:disabled){background:#bb44ff;box-shadow:0 0 20px #bb44ff;}

/* HUD */
#hud{position:absolute;top:20px;left:20px;display:none;}
.stat-box{background:rgba(0,0,0,0.7);padding:10px 20px;border-left:4px solid #bb44ff;margin-bottom:10px;}
#arms{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:600px;height:300px;display:flex;justify-content:space-between;align-items:flex-end;}
.arm{width:150px;height:250px;background:linear-gradient(to top, #1a0020, transparent);border-radius:50px 50px 0 0;box-shadow:0 0 40px rgba(187,68,255,0.3);transition:0.1s;}
</style>
</head>
<body>

<div id="game-wrap">
    <canvas id="c"></canvas>
    
    <div id="ui-layer">
        <div id="menu">
            <h1>COSMIC MORTAL</h1>
            <div class="cards">
                <div class="card" onclick="select('ron')">
                    <h2>RON</h2>
                    <p>Sun Cosmic</p>
                </div>
                <div class="card selected" onclick="select('lapse')">
                    <h2>LAPSE</h2>
                    <p>Galaxy Cosmic</p>
                </div>
            </div>
            <button id="start-btn" onclick="start()">ENTER THE VOID</button>
        </div>

        <div id="hud">
            <div class="stat-box" id="dist-ui">DISTANCE: 0m</div>
            <div class="stat-box" id="hp-ui">ENERGY: |||||</div>
        </div>

        <div id="arms" class="hidden">
            <div id="l-arm" class="arm"></div>
            <div id="r-arm" class="arm"></div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let gameState = 'menu';
let player = { x: 0, y: 0, targetX: 0, lane: 0, hp: 5, dist: 0 };
let tiles = [];
let particles = [];
let frame = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

function select(char) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
}

function start() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    gameState = 'play';
}

// Tile Object
class Tile {
    constructor(z) {
        this.z = z; // Depth
        this.lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
        this.type = Math.random() > 0.8 ? 'hazard' : 'path';
    }
}

// Controls
window.addEventListener('keydown', e => {
    if(e.key === 'a' || e.key === 'ArrowLeft') player.lane = Math.max(-1, player.lane - 1);
    if(e.key === 'd' || e.key === 'ArrowRight') player.lane = Math.min(1, player.lane + 1);
});

function update() {
    if(gameState !== 'play') return;
    
    frame++;
    player.dist += 0.2;
    document.getElementById('dist-ui').innerText = `DISTANCE: ${Math.floor(player.dist)}m`;

    // Smooth lane movement
    player.targetX = player.lane * (W * 0.25);
    player.x += (player.targetX - player.x) * 0.1;

    // Manage Tiles
    if(frame % 20 === 0) tiles.push(new Tile(100));
    
    tiles.forEach((t, i) => {
        t.z -= 0.5; // Move toward screen
        if(t.z <= 0) {
            // Collision Check
            if(t.type === 'hazard' && t.lane === player.lane) {
                player.hp -= 1;
                if(player.hp <= 0) location.reload();
            }
            tiles.splice(i, 1);
        }
    });

    // Animate Arms (Swaying while running)
    const sway = Math.sin(frame * 0.15) * 20;
    document.getElementById('l-arm').style.transform = `translateY(${sway}px)`;
    document.getElementById('r-arm').style.transform = `translateY(${-sway}px)`;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Draw Horizon / Perspective lines
    ctx.strokeStyle = '#bb44ff22';
    ctx.beginPath();
    ctx.moveTo(W/2, H/2); ctx.lineTo(0, H);
    ctx.moveTo(W/2, H/2); ctx.lineTo(W, H);
    ctx.stroke();

    // Draw Tiles
    tiles.sort((a, b) => b.z - a.z); // Draw furthest first
    tiles.forEach(t => {
        const scale = 1 / t.z;
        const x = W/2 + (t.lane * W * 0.3) * (scale * 50);
        const y = H/2 + (H * 0.5) * (scale * 50);
        const size = W * 0.2 * (scale * 50);

        if(t.z > 0) {
            ctx.fillStyle = t.type === 'hazard' ? '#ff0044' : '#bb44ff';
            ctx.globalAlpha = Math.min(1, 1/t.z * 10);
            
            ctx.beginPath();
            ctx.rect(x - size/2 - (player.x * scale * 5), y, size, size/4);
            ctx.fill();
            
            // Glow effect
            ctx.shadowBlur = 20 * (scale * 50);
            ctx.shadowColor = ctx.fillStyle;
        }
    });
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // Galaxy Particles
    if(Math.random() > 0.8) particles.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2});
    ctx.fillStyle = "#fff";
    particles.forEach((p, i) => {
        ctx.fillRect(p.x, p.y, p.s, p.s);
        p.y += 2;
        if(p.y > H) particles.splice(i, 1);
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>

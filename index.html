<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COSMIC LEGENDS: OMNI-EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; }
        
        /* UI STYLING */
        #game-ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
        .hud { position: absolute; top: 20px; left: 20px; color: #0ff; text-shadow: 0 0 10px #0ff; font-size: 22px; }
        #boss-overlay { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); width: 600px; display: none; text-align: center; }
        .health-bar { width: 100%; height: 25px; background: #111; border: 3px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        #health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0044, #ff6600); transition: width 0.1s ease-out; }

        /* SELECTOR */
        #menu-screen { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .hero-grid { display: flex; gap: 30px; margin: 40px; }
        .hero-card { width: 240px; padding: 40px 20px; background: #080808; border: 2px solid #222; border-radius: 15px; cursor: pointer; transition: 0.3s; text-align: center; }
        .hero-card:hover { border-color: #0ff; transform: translateY(-15px); box-shadow: 0 0 40px rgba(0, 255, 255, 0.2); }
        .hero-card.selected { border-color: #0ff; background: #001515; box-shadow: 0 0 50px #0ff; }
        .play-btn { padding: 25px 100px; font-size: 32px; background: #0ff; color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; opacity: 0.2; pointer-events: none; }
        .play-btn.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="hud">TILE: <span id="tile-stat">0</span>/100</div>
    <div id="boss-overlay">
        <h1 id="boss-id" style="color: #ff0044; margin: 0; letter-spacing: 5px;">BLACK DEATH</h1>
        <div class="health-bar"><div id="health-fill"></div></div>
        <p style="color: #fff; font-size: 14px;">[X] TO STRIKE!</p>
    </div>
</div>

<div id="menu-screen">
    <h1 style="font-size: 70px; margin: 0; color: #fff; letter-spacing: 15px;">COSMIC LEGENDS</h1>
    <div class="hero-grid">
        <div class="hero-card" onclick="pickHero('den', '#00f2ff', '⚡', 1.2, 1.0)">
            <div style="font-size: 80px;">⚡</div>
            <h2>DEN</h2>
            <p>High Speed & Rapid Jumps</p>
        </div>
        <div class="hero-card" onclick="pickHero('lapse', '#bc00ff', '🌌', 0.9, 0.6)">
            <div style="font-size: 80px;">🌌</div>
            <h2>LAPSE</h2>
            <p>Galaxy Glide (Low Gravity)</p>
        </div>
        <div class="hero-card" onclick="pickHero('ron', '#ff9900', '☀️', 1.0, 0.9)">
            <div style="font-size: 80px;">☀️</div>
            <h2>RON</h2>
            <p>Solar Shield & Balanced</p>
        </div>
    </div>
    <button id="launch-btn" class="play-btn" onclick="startGame()">START</button>
</div>

<canvas id="stage"></canvas>

<script>
/** * COSMIC ENGINE v3.0
 * Full Geometry Dash Physics + Boss State Machine
 */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Game State
let isRunning = false, isBossMode = false, bossHP = 100, currentTile = 0;
let cameraX = 0, scrollSpeed = 0, particles = [], platforms = [];
let heroData = { id: '', color: '#fff', icon: '', speedMult: 1, gravMult: 1 };
let bossCheckpoints = [30, 42, 58, 75, 100];

const player = {
    x: 100, y: 0, w: 50, h: 50,
    vx: 0, vy: 0, rotation: 0,
    grounded: false, coyoteTime: 0
};

function pickHero(id, color, icon, sM, gM) {
    heroData = { id, color, icon, speedMult: sM, gravMult: gM };
    document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    document.getElementById('launch-btn').classList.add('active');
}

function startGame() {
    document.getElementById('menu-screen').style.display = 'none';
    isRunning = true;
    player.y = canvas.height - 300;
    platforms = [{ x: 0, y: canvas.height - 100, w: 2500, h: 60 }];
}

/** PHYSICS ENGINE **/
function update() {
    if (!isRunning) return;

    if (!isBossMode) {
        player.vx = 9 * heroData.speedMult;
        if ((keys['Space'] || keys['ArrowUp']) && (player.grounded || player.coyoteTime > 0)) {
            player.vy = -18;
            player.grounded = false;
            player.coyoteTime = 0;
        }
    } else {
        player.vx = 0;
        if (keys['KeyX']) {
            bossHP -= 2.5;
            createParticles(player.x + 500, canvas.height/2, 'red', 10);
            if (bossHP <= 0) exitBoss();
        }
    }

    // Gravity & Movement
    player.vy += 0.8 * heroData.gravMult;
    player.x += player.vx;
    player.y += player.vy;
    
    // Rotation logic (Geometry Dash style)
    if (!player.grounded) player.rotation += 0.15;
    else player.rotation = 0;

    // Coyote Time logic
    if (player.grounded) player.coyoteTime = 10;
    else player.coyoteTime--;

    cameraX = player.x - 200;
    currentTile = Math.floor(player.x / 450);
    document.getElementById('tile-stat').innerText = currentTile;

    // Check for Boss Encounter
    if (bossCheckpoints.length > 0 && currentTile >= bossCheckpoints[0]) {
        enterBoss(bossCheckpoints[0] === 100 ? "REYSHI" : "BLACK DEATH");
        bossCheckpoints.shift();
    }

    // Platform Collision
    player.grounded = false;
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h > p.y && player.y + player.h < p.y + player.vy + 12) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    // Procedural Generation
    if (platforms[platforms.length - 1].x < cameraX + canvas.width + 500) {
        let last = platforms[platforms.length - 1];
        platforms.push({
            x: last.x + last.w + 120 + Math.random() * 100,
            y: canvas.height - 100 - (Math.random() * 180),
            w: 400 + Math.random() * 600,
            h: 60
        });
    }

    // Effects
    if (Math.random() > 0.5) createParticles(player.x, player.y + player.h, heroData.color, 1);
    updateParticles();

    if (player.y > canvas.height) location.reload();
}

/** STATE MANAGERS **/
function enterBoss(name) {
    isBossMode = true;
    bossHP = 100;
    document.getElementById('boss-overlay').style.display = 'block';
    document.getElementById('boss-id').innerText = name;
}

function exitBoss() {
    isBossMode = false;
    document.getElementById('boss-overlay').style.display = 'none';
}

/** RENDERER **/
function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Trails/Particles
    particles.forEach(part => {
        ctx.globalAlpha = part.life;
        ctx.fillStyle = part.color;
        ctx.fillRect(part.x, part.y, part.size, part.size);
    });
    ctx.globalAlpha = 1;

    // Platforms
    platforms.forEach(p => {
        ctx.fillStyle = '#0a0a0a';
        ctx.strokeStyle = heroData.color;
        ctx.lineWidth = 3;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    // Boss Visual
    if (isBossMode) {
        ctx.shadowBlur = 40; ctx.shadowColor = 'red';
        ctx.fillStyle = '#ff0044';
        ctx.font = '150px Orbitron';
        ctx.fillText(bossHP > 0 ? "👾" : "💥", player.x + 500, canvas.height / 2 + 50);
        ctx.shadowBlur = 0;
    }

    // Player
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rotation);
    ctx.shadowBlur = 20; ctx.shadowColor = heroData.color;
    ctx.fillStyle = heroData.color;
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.fillStyle = '#fff'; ctx.font = '24px Orbitron';
    ctx.fillText(heroData.icon, -12, 10);
    ctx.restore();

    ctx.restore();
    document.getElementById('health-fill').style.width = bossHP + "%";
}

/** UTILITIES **/
const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => keys[e.code] = false;

function createParticles(x, y, color, amt) {
    for (let i = 0; i < amt; i++) {
        particles.push({
            x, y, color,
            size: Math.random() * 5 + 2,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function main() { update(); draw(); requestAnimationFrame(main); }
main();
</script>
</body>
</html>

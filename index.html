<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC LEGENDS: PIXEL OVERDRIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Press Start 2P', cursive; }
        canvas { display: block; image-rendering: pixelated; } /* FORCING PIXEL LOOK */

        /* RETRO LOBBY */
        #menu { 
            position: absolute; inset: 0; z-index: 1000;
            background: #050505; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 10px solid #222;
        }
        .pixel-title { font-size: 24px; color: #fff; margin-bottom: 50px; text-align: center; line-height: 1.5; color: #0ff; }
        .hero-row { display: flex; gap: 15px; }
        .pixel-card { 
            width: 100px; padding: 20px 5px; border: 4px solid #444; 
            background: #111; color: #fff; cursor: pointer; text-align: center;
        }
        .pixel-card:hover { border-color: #fff; }
        .pixel-card.selected { border-color: #0ff; background: #003333; box-shadow: 0 0 0 4px #0ff; }
        .pixel-card span { font-size: 30px; display: block; margin-bottom: 10px; }
        .pixel-card h3 { font-size: 8px; margin: 0; }

        .start-btn { 
            margin-top: 40px; padding: 15px 30px; background: #fff; 
            border: 4px solid #000; font-family: 'Press Start 2P'; 
            font-size: 14px; cursor: pointer; display: none;
        }

        /* HUD */
        #hud { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 10px; z-index: 100; }
        #boss-hp { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 200px; height: 12px; border: 3px solid #fff; display: none; background: #000; }
        #hp-fill { width: 100%; height: 100%; background: #f00; }
    </style>
</head>
<body onmousedown="btn()" ontouchstart="btn()">

<div id="hud">TILE: <span id="t-ui">0</span>/100</div>
<div id="boss-hp"><div id="hp-fill"></div></div>

<div id="menu">
    <div class="pixel-title">COSMIC LEGENDS<br><span style="font-size: 10px; color: #fff;">PIXEL PROTOCOL</span></div>
    <div class="hero-row">
        <div class="pixel-card" onclick="sel('ron','#f40','☀️','fire')"><span>☀️</span><h3>RON</h3></div>
        <div class="pixel-card" onclick="sel('den','#0ff','⚡','light')"><span>⚡</span><h3>DEN</h3></div>
        <div class="pixel-card" onclick="sel('lapse','#b0f','🌌','galaxy')"><span>🌌</span><h3>LAPSE</h3></div>
    </div>
    <button id="st" class="start-btn" onclick="go()">START GAME</button>
</div>

<canvas id="stage"></canvas>

<script>
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');
cvs.width = 400; cvs.height = 240; // LOWER RESOLUTION FOR PIXEL EFFECT
const renderScale = window.innerWidth / 400;
cvs.style.width = window.innerWidth + 'px';
cvs.style.height = window.innerHeight + 'px';

let run = false, boss = false, hp = 100, camX = 0, tile = 0, hero = {};
let platforms = [], spikes = [], stars = [];
let checkpoints = [30, 55, 75, 100];

const p = { x: 50, y: 0, w: 18, h: 18, vx: 0, vy: 0, rot: 0, gr: false };

function sel(id, col, icon, mode) {
    hero = { id, col, icon, mode };
    document.querySelectorAll('.pixel-card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    document.getElementById('st').style.display = 'block';
}

function go() { document.getElementById('menu').style.display = 'none'; run = true; p.y = 150; platforms = [{x:0, y:200, w:1000}]; }

function btn() {
    if(!run) return;
    if(boss) { 
        hp -= 6; if(hp <= 0) { boss = false; document.getElementById('boss-hp').style.display = 'none'; }
    } else if(p.gr) { p.vy = -7.5; p.gr = false; }
}

function update() {
    if(!run) return;
    if(!boss) { p.vx = 4; p.vy += 0.45; } else { p.vx = 0; p.vy += 0.45; }
    p.x += p.vx; p.y += p.vy;
    p.rot += p.gr ? 0 : 0.25;
    camX = p.x - 40;
    tile = Math.floor(p.x / 200);
    document.getElementById('t-ui').innerText = tile;

    if(checkpoints.length > 0 && tile >= checkpoints[0]) {
        boss = true; hp = 100; document.getElementById('boss-hp').style.display = 'block';
        checkpoints.shift();
    }

    p.gr = false;
    platforms.forEach(l => {
        if(p.x+p.w > l.x && p.x < l.x+l.w && p.y+p.h > l.y && p.y+p.h < l.y+p.vy+5) {
            p.y = l.y-p.h; p.vy = 0; p.gr = true; p.rot = 0;
        }
    });

    spikes.forEach(s => {
        if(p.x < s.x+10 && p.x+p.w > s.x-10 && p.y+p.h > s.y-20 && p.y < s.y) location.reload();
    });

    if(platforms[platforms.length-1].x < camX + 500) {
        let last = platforms[platforms.length-1];
        let nw = 150 + Math.random()*200;
        let nx = last.x + last.w + 60 + Math.random()*40;
        let ny = 200 - Math.random()*80;
        platforms.push({x: nx, y: ny, w: nw});
        if(Math.random() > 0.4) spikes.push({x: nx + nw/2, y: ny});
    }
    if(p.y > 300) location.reload();
}

function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,240);

    // PIXELATED ELEMENTAL BGS
    if(hero.mode === 'fire') {
        ctx.fillStyle = '#410';
        for(let i=0; i<8; i++) ctx.fillRect(Math.random()*400, 0, 2, 240);
    } else if(hero.mode === 'light') {
        if(Math.random()>0.9) { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,400,240); }
    } else if(hero.mode === 'galaxy') {
        ctx.fillStyle = '#505';
        for(let i=0; i<20; i++) ctx.fillRect(Math.random()*400, Math.random()*240, 2, 2);
    }

    ctx.save(); ctx.translate(-camX, 0);

    // SPIKES
    ctx.fillStyle = "#f00"; spikes.forEach(s => {
        ctx.beginPath(); ctx.moveTo(s.x-12, s.y); ctx.lineTo(s.x+12, s.y); ctx.lineTo(s.x, s.y-22); ctx.fill();
    });

    // PLATFORMS
    ctx.fillStyle = "#111"; ctx.strokeStyle = hero.col; ctx.lineWidth = 2;
    platforms.forEach(l => { ctx.fillRect(l.x, l.y, l.w, 100); ctx.strokeRect(l.x, l.y, l.w, 100); });

    // BOSS
    if(boss) {
        ctx.fillStyle = "red"; ctx.font = "40px sans-serif";
        ctx.fillText(tile >= 100 ? "👁️" : "💀", p.x+150, 100);
    }

    // PLAYER
    ctx.save(); ctx.translate(p.x+p.w/2, p.y+p.h/2); ctx.rotate(p.rot);
    ctx.fillStyle = hero.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif"; ctx.fillText(hero.icon, -6, 4);
    ctx.restore();

    ctx.restore();
    document.getElementById('hp-fill').style.width = hp + "%";
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>

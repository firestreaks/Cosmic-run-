<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC LEGENDS: ELEMENTAL OVERDRIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; height: 100%; }
        canvas { display: block; z-index: 1; position: relative; }

        /* COOLER LOBBY UI */
        #menu { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 200; transition: 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
        
        .lobby-header {
            text-align: center; margin-bottom: 40px;
        }
        
        .lobby-header h1 {
            font-size: clamp(30px, 8vw, 60px); color: #fff; margin: 0;
            letter-spacing: 12px; text-shadow: 0 0 30px rgba(0,255,255,0.6);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow { from { text-shadow: 0 0 10px #0ff; } to { text-shadow: 0 0 40px #0ff, 0 0 10px #fff; } }

        .hero-grid { display: flex; gap: 20px; padding: 20px; }
        
        .card { 
            width: 120px; padding: 30px 10px; 
            background: rgba(255,255,255,0.03); 
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px; cursor: pointer; color: white;
            transition: 0.4s; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center;
        }
        
        .card:hover { transform: translateY(-10px); border-color: #fff; background: rgba(255,255,255,0.1); }
        .card.selected { border-color: #0ff; box-shadow: 0 0 30px #0ff; transform: scale(1.1); background: rgba(0,255,255,0.15); }
        .card .icon { font-size: 40px; margin-bottom: 10px; filter: drop-shadow(0 0 10px inherit); }
        .card h3 { font-size: 14px; margin: 0; letter-spacing: 2px; }

        #start-btn { 
            margin-top: 50px; padding: 18px 60px; 
            background: none; color: #fff; border: 2px solid #fff;
            font-family: 'Orbitron'; font-weight: 900; font-size: 20px;
            cursor: pointer; border-radius: 50px; transition: 0.3s;
            opacity: 0.2; pointer-events: none;
        }
        #start-btn.active { opacity: 1; pointer-events: auto; background: #fff; color: #000; box-shadow: 0 0 20px #fff; }

        /* IN-GAME HUD */
        #hud { position: absolute; top: 20px; left: 20px; z-index: 100; color: #fff; pointer-events: none; }
        #boss-ui { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 80%; display: none; z-index: 110; text-align: center; }
        .hp-cont { width: 100%; height: 15px; background: #200; border: 2px solid #fff; border-radius: 20px; overflow: hidden; }
        #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #f0f); }
    </style>
</head>
<body onmousedown="jump()" ontouchstart="jump()">

<div id="hud">TILE: <span id="t-val">0</span>/100</div>

<div id="boss-ui">
    <h2 id="b-name" style="color:#ff0044; margin:0 0 10px;">BLACK DEATH</h2>
    <div class="hp-cont"><div id="hp-bar"></div></div>
</div>

<div id="menu">
    <div class="lobby-header">
        <h1>COSMIC LEGENDS</h1>
        <p style="color:#888; font-size: 12px; letter-spacing: 4px;">CHOOSE YOUR ELEMENT</p>
    </div>
    
    <div class="hero-grid">
        <div class="card" onclick="pick('ron', '#ff4400', '☀️', 1.0, 0.9, 'fire')">
            <div class="icon">☀️</div><h3>RON</h3>
        </div>
        <div class="card" onclick="pick('den', '#00f2ff', '⚡', 1.2, 1.0, 'lightning')">
            <div class="icon">⚡</div><h3>DEN</h3>
        </div>
        <div class="card" onclick="pick('lapse', '#bc00ff', '🌌', 0.9, 0.6, 'galaxy')">
            <div class="icon">🌌</div><h3>LAPSE</h3>
        </div>
    </div>
    
    <button id="start-btn" onclick="go()">INITIATE SEQUENCE</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

let active = false, bossMode = false, hp = 100, camX = 0, currentTile = 0;
let hero = { id:'', color:'#fff', icon:'', s:1, g:1, mode:'' };
let platforms = [], spikes = [], bgElements = [];
let bosses = [30, 55, 75, 100];

const p = { x: 100, y: 0, w: 45, h: 45, vx: 0, vy: 0, rot: 0, gr: false };

function pick(id, color, icon, s, g, mode) {
    hero = { id, color, icon, s, g, mode };
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    document.getElementById('start-btn').classList.add('active');
}

function go() {
    document.getElementById('menu').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('menu').style.display = 'none';
        active = true; p.y = canvas.height - 200;
        platforms = [{x: 0, y: canvas.height-100, w: 2500}];
    }, 800);
}

function jump() {
    if(!active) return;
    if(bossMode) {
        hp -= 4;
        if(hp <= 0) { bossMode = false; document.getElementById('boss-ui').style.display='none'; }
    } else if(p.gr) { p.vy = -17; p.gr = false; }
}

window.onkeydown = (e) => { if(e.code === 'Space' || e.code === 'KeyX') jump(); };

function update() {
    if(!active) return;
    if(!bossMode) { p.vx = 9 * hero.s; p.vy += 0.8 * hero.g; } 
    else { p.vx = 0; p.vy += 0.8; }

    p.x += p.vx; p.y += p.vy;
    p.rot += p.gr ? 0 : 0.2;
    camX = p.x - 100;
    currentTile = Math.floor(p.x / 450);
    document.getElementById('t-val').innerText = currentTile;

    if(bosses.length > 0 && currentTile >= bosses[0]) {
        bossMode = true; hp = 100;
        document.getElementById('boss-ui').style.display = 'block';
        document.getElementById('b-name').innerText = bosses[0] === 100 ? "REYSHI" : "BLACK DEATH";
        bosses.shift();
    }

    p.gr = false;
    platforms.forEach(plat => {
        if(p.x+p.w > plat.x && p.x < plat.x+plat.w && p.y+p.h > plat.y && p.y+p.h < plat.y+p.vy+10) {
            p.y = plat.y-p.h; p.vy = 0; p.gr = true; p.rot = 0;
        }
    });

    spikes.forEach(s => {
        if(p.x < s.x + 20 && p.x + p.w > s.x - 20 && p.y < s.y && p.y + p.h > s.y - 40) location.reload();
    });

    if(platforms[platforms.length-1].x < camX + canvas.width + 500) {
        let last = platforms[platforms.length-1];
        let nw = 400 + Math.random()*600;
        let nx = last.x + last.w + 130 + Math.random()*100;
        let ny = canvas.height - 100 - Math.random()*150;
        platforms.push({x: nx, y: ny, w: nw});
        if(Math.random() > 0.5) spikes.push({x: nx + nw/2, y: ny});
    }
    if(p.y > canvas.height) location.reload();
}

function drawBackground() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width, canvas.height);
    
    // THE 3 ELEMENTAL MODES
    if(hero.mode === 'fire') {
        for(let i=0; i<10; i++) {
            ctx.fillStyle = `rgba(255, 50, 0, ${Math.random()*0.2})`;
            ctx.fillRect(Math.random()*canvas.width, 0, Math.random()*100, canvas.height);
        }
    } else if(hero.mode === 'lightning') {
        if(Math.random() > 0.9) {
            ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(Math.random()*canvas.width, 0);
            ctx.lineTo(Math.random()*canvas.width, canvas.height); ctx.stroke();
        }
    } else if(hero.mode === 'galaxy') {
        ctx.fillStyle = '#fff';
        for(let i=0; i<50; i++) {
            let x = (Math.sin(Date.now()*0.001 + i)*200) + canvas.width/2;
            let y = (Math.cos(Date.now()*0.001 + i)*200) + canvas.height/2;
            ctx.fillRect(x, y, 2, 2);
        }
    }
}

function draw() {
    drawBackground();
    ctx.save(); ctx.translate(-camX, 0);

    // SPIKES
    ctx.fillStyle = "#ff4444";
    spikes.forEach(s => {
        ctx.beginPath(); ctx.moveTo(s.x-20, s.y); ctx.lineTo(s.x+20, s.y); ctx.lineTo(s.x, s.y-40); ctx.fill();
    });

    // PLATFORMS
    ctx.lineWidth = 3; ctx.strokeStyle = hero.color; ctx.fillStyle = "rgba(10,10,10,0.8)";
    platforms.forEach(plat => { ctx.fillRect(plat.x, plat.y, plat.w, 100); ctx.strokeRect(plat.x, plat.y, plat.w, 100); });

    // BOSS
    if(bossMode) {
        ctx.fillStyle = "red"; ctx.font = "150px Orbitron";
        ctx.fillText(hp > 0 ? "💀" : "💥", p.x + 400, canvas.height/2);
    }

    // PLAYER
    ctx.save(); ctx.translate(p.x+p.w/2, p.y+p.h/2); ctx.rotate(p.rot);
    ctx.shadowBlur = 25; ctx.shadowColor = hero.color; ctx.fillStyle = hero.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.fillStyle = "#fff"; ctx.font = "24px Orbitron"; ctx.fillText(hero.icon, -12, 10);
    ctx.restore();

    ctx.restore();
    document.getElementById('hp-bar').style.width = hp + "%";
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
